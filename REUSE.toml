# License and copyright for the files that cannot carry a header (the REUSE specification's
# annotation format). Every other source file states both in its first lines.
version = 1

# The pinned files. A released migration is recorded by its SHA-256 when it is applied, and
# `polaris-migrate.sh --down` refuses a file changed since; the frozen version-1 vectors are
# never edited. check_source_files_carry_license_header holds this entry to the paths it exempts.
[[annotations]]
path = ["polaris_sql/migrations/**", "conformance/frozen/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Egor Khaklin and the Polaris contributors"
SPDX-License-Identifier = "Apache-2.0"

# The brand files: the Polaris logo and star mark, the owl emblem, and the Khaklin Technologies
# lockup. The license covers the files, not the names and marks they carry (TRADEMARKS.md).
[[annotations]]
path = ["site/polaris_logo_clean.png", "site/polaris_logo.webp", "site/polaris_logo_180.png", "polaris_web/static/favicon.svg",
        "docs/assets/seal.svg", "docs/assets/hero.svg", "site/khaklin.svg", "site/og.png", "site/hero/coin-*"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Egor Khaklin"
SPDX-License-Identifier = "Apache-2.0"

# The OpenID Certified mark belongs to the OpenID Foundation and is used under its
# certification terms. The project does not license it (TRADEMARKS.md).
[[annotations]]
path = ["docs/assets/openid-certified-mark-on-white.png", "site/openid-certified-mark-on-white.png"]
precedence = "closest"
SPDX-FileCopyrightText = "OpenID Foundation"
SPDX-License-Identifier = "LicenseRef-OpenID-Certified-Mark"

# The hero's sky and the star trails: the Milky Way of NASA's Deep Star Maps 2020 (https://svs.gsfc.nasa.gov/4851, credited as it
# asks), with the stars of the Yale Bright Star Catalogue placed by the project. The project licenses these
# adaptations CC BY-SA 3.0 IGO, the cautious choice for material built on Gaia data.
[[annotations]]
path = ["site/hero/sky-*", "site/film/trails-*"]
precedence = "closest"
SPDX-FileCopyrightText = "NASA/Goddard Space Flight Center Scientific Visualization Studio; Gaia DR2: ESA/Gaia/DPAC; 2026 Egor Khaklin and the Polaris contributors"
SPDX-License-Identifier = "CC-BY-SA-3.0-IGO"

# The acts' other images: the project's own renders (Blender). Their lettering is set in Cinzel and JetBrains Mono,
# the site's fonts (SIL Open Font License).
[[annotations]]
path = ["site/film/iii-*", "site/film/iv-*", "site/film/vii-*"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Egor Khaklin and the Polaris contributors"
SPDX-License-Identifier = "Apache-2.0"
