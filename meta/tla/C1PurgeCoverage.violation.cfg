\* The counterpart configuration, and it is EXPECTED TO FAIL.
\*
\* A spec whose invariant holds no matter what is proving nothing, exactly as a
\* check that cannot detect its own violation is treated as broken here. This
\* configuration turns on a second setter of polaris.purge_in_progress and
\* requires TLC to find a reachable state where a committed DELETE has no
\* committed checkpoint. scripts/polaris-tla-drill.py runs it and fails if the
\* violation does NOT occur.
\*
\* What it establishes is the shape of the result: purge coverage does not
\* follow from the trigger, which permits any DELETE while the GUC is TRUE. It
\* follows from the GUC having exactly one setter, inside uc_archive_purge,
\* which writes the checkpoint in the same transaction. check_formal_specs
\* asserts that in the SQL, so the assumption this spec rests on is enforced
\* where it can actually be broken.
SPECIFICATION Spec
CONSTANTS
    Rows = {1, 2}
    Txs = {1, 2}
    RogueCarveOut = TRUE
    MaxRejects = 3
INVARIANT TypeOK
INVARIANT PurgeCoverage
CHECK_DEADLOCK FALSE
