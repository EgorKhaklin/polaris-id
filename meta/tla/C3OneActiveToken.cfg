\* Companion configuration for C3OneActiveToken.tla (roadmap P6.7).
\*
\* Individuals = {1, 2} is the smallest population in which C3 can be violated:
\* one individual cannot collide with themselves across two rows unless a second
\* exists to show the constraint is per-individual rather than global.
SPECIFICATION Spec
CONSTANTS
    Individuals = {1, 2}
    MaxTokens = 4
    MaxOperations = 12
INVARIANT C3_OneActiveTokenPerIndividual
INVARIANT TypeOK
\* Deadlock checking off, deliberately. Every action is guarded by
\* op_count < MaxOperations, so at the bound no action is enabled and TLC
\* reports "deadlock". That is the bound working: this is a bounded
\* exploration of a system that in reality never stops, and running out of
\* modelled operations is the intended terminal state rather than a system
\* that has seized. The guard is what keeps TypeOK's own op_count bound true.
CHECK_DEADLOCK FALSE
