\* The counterpart, EXPECTED TO FAIL. An authority minting a window WIDER than
\* the verifier's ceiling, and a verifier that does not check.
\*
\* StalenessBoundedByWindow still holds: the verifier is behaving correctly
\* with respect to the window it was handed. What fails is
\* StalenessBoundedByCeiling, the bound the verifier believed it controlled.
\* That is the point: dropping the ceiling check does not make the verifier
\* wrong about the assertion, it moves who decides the exposure from the
\* verifier to the issuer, and nothing local looks broken when it happens.
SPECIFICATION Spec
CONSTANTS
    MaxTime = 8
    Window = 6
    VerifierCeiling = 2
    EnforceCeiling = FALSE
INVARIANT TypeOK
INVARIANT StalenessBoundedByCeiling
CHECK_DEADLOCK FALSE
