\* The counterpart, EXPECTED TO FAIL. A nullifier derived from the holder and
\* the epoch but NOT the scope: the slip that looks like a simplification.
\*
\* OneVerifierRecognisesARepeat still passes under it, which is what makes the
\* slip dangerous: the mechanism appears to work, a relying party can still
\* refuse a repeat, and nothing local is broken. NoTwoVerifiersCanLink is the
\* one that fails, and it fails only when two relying parties compare notes,
\* which is exactly the thing nobody is present to observe.
SPECIFICATION Spec
CONSTANTS
    Holders = {1, 2}
    Verifiers = {1, 2}
    Epochs = {1}
    ScopedNullifier = FALSE
INVARIANT TypeOK
INVARIANT NoTwoVerifiersCanLink
CHECK_DEADLOCK FALSE
