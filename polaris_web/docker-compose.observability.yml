# ============================================================================
# docker-compose.observability.yml — the dashboards-as-code stack
# (v9.187 / roadmap P1.6)
#
# An OVERLAY on the production stack, same pattern as the blue-green and
# custody templates:
#
#   docker compose -f docker-compose.prod.yml \
#                  -f docker-compose.observability.yml up -d
#
# What it adds, all on the existing polaris-net:
#   prometheus    scrapes the app, evaluates the shipped alert rules
#   alertmanager  routes them to your pager (the P0.10 page path)
#   tempo         receives the app's OTLP traces (POLARIS_OTEL=1 turns the
#                 app's exporter on; its endpoint already defaults to
#                 http://tempo:4318 in docker-compose.prod.yml)
#   grafana       boots PROVISIONED: datasources and the committed dashboards
#                 under deploy/observability/grafana/ — nothing clicked
#                 together, everything reviewable in git
#
# Before first up:
#   echo -n '<a strong password>' > "${POLARIS_SECRETS_DIR:-./secrets}/grafana_admin_password"
#   echo -n '<your pager webhook url>' > "${POLARIS_SECRETS_DIR:-./secrets}/pager_webhook_url"
# Prometheus finds the app on polaris-net by its service name (app, and
# app-green under the blue-green overlay) and scrapes it there; nothing to edit.
#
# Grafana listens on 127.0.0.1:3000 only (operator-internal, like /metrics:
# it can display the duress signal, so it must never face the public
# internet). Reach it over SSH forwarding or your management network.
#
# Images are digest-pinned (the repo standard): prometheus/alertmanager use
# the same digests scripts/polaris-page-drill.sh drills with.
# ============================================================================

services:
  prometheus:
    image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: polaris-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ../deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../deploy/observability/polaris-alerts.yml:/etc/prometheus/polaris-alerts.yml:ro
      - ../deploy/observability/polaris-slo.yml:/etc/prometheus/polaris-slo.yml:ro
      - prometheus_data:/prometheus
    networks:
      - polaris-net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  # Lab record 017 (gate row OP-15): reads the certificate the edge serves, under the deployment's
  # domain, for PolarisCertificateExpiring. The image's own shell fills POLARIS_DOMAIN into
  # blackbox.yml at start; it runs as nobody on a read-only root.
  blackbox:
    image: prom/blackbox-exporter@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc  # v0.28.0
    container_name: polaris-blackbox
    restart: unless-stopped
    user: "65534:65534"
    environment:
      POLARIS_DOMAIN: ${POLARIS_DOMAIN:?POLARIS_DOMAIN must be set in shell env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - sed "s|__POLARIS_DOMAIN__|$${POLARIS_DOMAIN}|g" /etc/blackbox/blackbox.yml > /tmp/blackbox.yml
        && exec /bin/blackbox_exporter --config.file=/tmp/blackbox.yml
    volumes:
      - ../deploy/observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - polaris-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  alertmanager:
    image: prom/alertmanager@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    container_name: polaris-alertmanager
    restart: unless-stopped
    volumes:
      - ../deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # One line, NOT committed (see deploy/observability/README.md):
      - ${POLARIS_SECRETS_DIR:-./secrets}/pager_webhook_url:/etc/alertmanager/secrets/pager_webhook_url:ro
      - alertmanager_data:/alertmanager
    networks:
      - polaris-net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  tempo:
    image: grafana/tempo@sha256:f0561deb1c68ec44d6e6e7e4487f30106c4e5e768642077695b37958b105812a  # 2.10.8
    container_name: polaris-tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo.yml']
    volumes:
      - ../deploy/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - polaris-net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  grafana:
    image: grafana/grafana@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283  # 13.2.1
    container_name: polaris-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ../deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${POLARIS_SECRETS_DIR:-./secrets}/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - polaris-net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

volumes:
  prometheus_data:
  alertmanager_data:
  tempo_data:
  grafana_data:
