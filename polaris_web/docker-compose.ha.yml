# ============================================================================
# docker-compose.ha.yml — the HA profile: supervisor-managed automated
# failover for the database (v9.243, roadmap P2.7).
#
# Overlay on docker-compose.prod.yml:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.ha.yml up -d
#   (or POLARIS_COMPOSE_EXTRA="-f docker-compose.ha.yml" for polaris-deploy.sh)
#
# What it adds:
#   postgres, postgres2   the same database image, run by Patroni instead of
#                         the stock entrypoint (started as root and dropped to
#                         postgres, like the stock one): Patroni bootstraps one member,
#                         clones the other with pg_basebackup, keeps the
#                         leader lease in etcd, promotes the replica when the
#                         leader's lease lapses, and rejoins a returning old
#                         leader with pg_rewind.
#   etcd1, etcd2, etcd3   the lease store (a three-member quorum), on its own
#                         internal network that only the database members
#                         join.
#   pg-router             HAProxy: 5432 goes to whichever member answers
#                         Patroni's /primary, 5433 to a streaming replica.
#                         pgbouncer dials pg-router instead of postgres, so
#                         the application does not know there are two.
#
# On one host this profile proves the mechanism (scripts/polaris-failover-drill.sh
# runs it in CI: a leader crash, a leader cut off from the lease store, a
# planned switchover, an etcd member crash). In production the two database
# members and the three etcd members belong on separate hosts, which is the
# operator's placement (docs/operator/FAILOVER.md); the compose file is the
# same, with POLARIS_PATRONI_ETCD_HOSTS and POLARIS_PATRONI_HOST naming the
# real addresses. etcd here speaks plain HTTP on the internal network; across
# hosts it needs TLS between members and from Patroni, also documented there.
# ============================================================================
services:
  postgres:
    command: ["/usr/local/bin/polaris-patroni-entrypoint.sh"]
    environment:
      POLARIS_PATRONI_NAME: postgres
      POLARIS_PATRONI_SCOPE: polaris
      POLARIS_PATRONI_ETCD_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      # WAL archiving stays opt-in here (lab record 017): the single node turns it on by default
      # and creates the stanza at its first init, but the Patroni path creates no stanza, and a
      # leader archiving to a repository without one fails every push. Setting the variable turns
      # it on for both profiles.
      POLARIS_PGBACKREST_ENABLED: "${POLARIS_PGBACKREST_ENABLED:-0}"
      # The lease: a leader that cannot renew within ttl seconds demotes itself.
      POLARIS_PATRONI_TTL: "20"
      POLARIS_PATRONI_LOOP_WAIT: "5"
      POLARIS_PATRONI_RETRY_TIMEOUT: "5"
    healthcheck:
      # Patroni's /health answers 200 while Postgres runs, in either role.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8008/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s
    depends_on:
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
    networks:
      - polaris-dcs

  postgres2:
    extends:
      file: docker-compose.prod.yml
      service: postgres
    container_name: polaris-postgres2
    command: ["/usr/local/bin/polaris-patroni-entrypoint.sh"]
    environment:
      POLARIS_PATRONI_NAME: postgres2
      POLARIS_PATRONI_SCOPE: polaris
      POLARIS_PGBACKREST_ENABLED: "${POLARIS_PGBACKREST_ENABLED:-0}"
      POLARIS_PATRONI_ETCD_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      POLARIS_PATRONI_TTL: "20"
      POLARIS_PATRONI_LOOP_WAIT: "5"
      POLARIS_PATRONI_RETRY_TIMEOUT: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8008/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s
    volumes: !override
      - pg_data2:/var/lib/postgresql/data
      - ../polaris_sql:/docker-entrypoint-initdb.d/sql:ro
      - ./docker-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ${POLARIS_SECRETS_DIR:-./secrets}/postgres_server.crt:/etc/polaris-pg-certs/server.crt:ro
      - ${POLARIS_SECRETS_DIR:-./secrets}/postgres_server.key:/etc/polaris-pg-certs/server.key:ro
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest_repo:/var/lib/pgbackrest
      - ${POLARIS_SECRETS_DIR:-./secrets}/pgbackrest_repo_creds.conf:/etc/pgbackrest/conf.d/repo-creds.conf:ro
    depends_on:
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - polaris-net
      - polaris-dcs

  etcd1:
    image: polaris-etcd:prod
    build:
      context: .
      dockerfile: Dockerfile.etcd
    container_name: polaris-etcd1
    restart: unless-stopped
    command:
      - --name=etcd1
      - --data-dir=/var/lib/etcd
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --advertise-client-urls=http://etcd1:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=polaris-dcs
      - --auto-compaction-retention=1h
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - etcd1_data:/var/lib/etcd
    networks:
      - polaris-dcs

  etcd2:
    extends:
      service: etcd1
    container_name: polaris-etcd2
    command:
      - --name=etcd2
      - --data-dir=/var/lib/etcd
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --advertise-client-urls=http://etcd2:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=polaris-dcs
      - --auto-compaction-retention=1h
    volumes: !override
      - etcd2_data:/var/lib/etcd

  etcd3:
    extends:
      service: etcd1
    container_name: polaris-etcd3
    command:
      - --name=etcd3
      - --data-dir=/var/lib/etcd
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --advertise-client-urls=http://etcd3:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=polaris-dcs
      - --auto-compaction-retention=1h
    volumes: !override
      - etcd3_data:/var/lib/etcd

  pg-router:
    image: haproxy:3.1-alpine@sha256:475863a372c92c3dab3d59eafbbf8019dceebcd0c456594551b160ecdba4bdb9
    container_name: polaris-pg-router
    restart: unless-stopped
    volumes:
      - ./haproxy-pg.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polaris-net

  pgbouncer:
    environment:
      POLARIS_DB_HOST: pg-router
      # v9.246 (roadmap P2.2) — the read-only database routed to a replica via
      # the router's /replica endpoint (5433). The app dials polaris_ro for the
      # atlas, lists and exports; a failover moves the replica the router picks.
      POLARIS_DB_REPLICA_HOST: pg-router
      POLARIS_DB_REPLICA_PORT: '5433'
    depends_on:
      pg-router:
        condition: service_healthy

  # v9.246 (roadmap P2.2) — the app routes its read-only surfaces (atlas, lists,
  # exports) to the replica through the pooler's polaris_ro database, under the
  # staleness contract; correctness-critical reads stay on the primary.
  app:
    environment:
      POLARIS_DB_REPLICA_NAME: polaris_ro
  app-green:
    environment:
      POLARIS_DB_REPLICA_NAME: polaris_ro

networks:
  polaris-dcs:
    driver: bridge
    internal: true

volumes:
  pg_data2:
  etcd1_data:
  etcd2_data:
  etcd3_data:
