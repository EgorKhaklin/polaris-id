# ============================================================================
# pgbackrest.conf — Polaris continuous-WAL-archiving stanza
#
# v9.126+ (production-readiness, Wave 3). Mounted into the postgres container at
# /etc/pgbackrest/pgbackrest.conf. The primary's archive_command pushes WAL here
# (enabled by docker-init.sh when POLARIS_PGBACKREST_ENABLED is set); the
# operator runs `pgbackrest --stanza=polaris stanza-create` once, then `backup`
# on a schedule. See docs/operator/DR.md.
#
# WHERE THE REPO LIVES IS NOT IN THIS FILE (v9.173, roadmap P0.9). pgBackRest
# refuses an option that appears in more than one config file ("option
# 'repo1-path' cannot be set multiple times"), so the repo location lives in
# exactly one place: /etc/pgbackrest/conf.d/repo.conf, rendered at every
# container start by the image entrypoint (pgbackrest-conf.sh) from env:
#
#   always                              -> repo1, a LOCAL filesystem repo
#                                          (/var/lib/pgbackrest). Fine for the
#                                          CI round-trip and a drill; NOT
#                                          offsite, it does not survive the host.
#   POLARIS_PGBACKREST_S3_BUCKET set    -> PLUS repo2, an S3-compatible OFFSITE
#     (+ _ENDPOINT, _REGION; optional       repo encrypted by pgBackRest
#      _PATH, _PORT, _URI_STYLE,             (repo2-cipher-type=aes-256-cbc).
#      _CA_FILE, _VERIFY_TLS)                WAL goes to both; the CI offsite
#                                            drill exercises it against an S3 API.
#
# No repo2- option belongs in THIS file: any repo2 option configures a repo2,
# at pgBackRest's default local path when no bucket is set. The renderer writes
# repo2's retention (repo2-retention-full=2) and bundling with the bucket.
#
# THE S3 CREDENTIALS ARE ROOT-LEVEL SECRETS (read/write/delete every backup).
# They are NEVER taken from env (env literals leak via `docker inspect`,
# `docker compose config`, and the process listing; the renderer refuses to
# start the container if it finds them there). They go in the separate secret
# fragment polaris_web/secrets/pgbackrest_repo_creds.conf (gitignored, created
# empty by polaris-generate-secrets.sh, mounted read-only by the prod compose at
# /etc/pgbackrest/conf.d/repo-creds.conf):
#
#   [global]
#   repo2-s3-key=<access-key>
#   repo2-s3-key-secret=<secret-key>
#   repo2-cipher-pass=<32+ characters: openssl rand -base64 48>
#
# The passphrase is mandatory with a bucket (the container refuses to start
# without it) and is never env either.
#
# An operator with an exotic repo (Azure, GCS, an SFTP host) mounts their own
# read-only /etc/pgbackrest/conf.d/repo.conf; the renderer leaves a read-only
# file alone.
# ============================================================================

[global]
# Keep two full backups + their differentials/WAL; older are expired on backup.
repo1-retention-full=2
# Checksums on the repo so silent corruption is caught.
repo1-bundle=y
# A non-blocking checkpoint at backup start (lower impact on a busy primary).
start-fast=y
# Compress WAL + backups in the repo.
compress-type=zst
# Surface real errors; archive-push retries are postgres's job.
log-level-console=info
log-level-file=detail

[polaris]
pg1-path=/var/lib/postgresql/data
