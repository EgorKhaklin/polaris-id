[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-sdk-python"
version = "1.0.0rc2"
description = "Reference Python SDK for verifying Polaris identity credentials: offline authenticity and online status. A library; the command-line verifier is the separate polaris-verify package."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# The other two publishable packages carry these and this one carried none, so its project
# page would have shown no maturity signal at all: 0.1.0, unpublished, no outside user, and
# nothing on the page saying so. The front-door rule is that an outward surface must not read
# as more settled than the thing is.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
authors = [{ name = "Egor Khaklin" }]
dependencies = ["cryptography>=48"]

[project.urls]
Homepage = "https://github.com/EgorKhaklin/polaris-id"
Conformance = "https://github.com/EgorKhaklin/polaris-id/tree/main/conformance"

[tool.setuptools.packages.find]
where = ["."]
include = ["polaris_verify*"]
