# Polaris: Prometheus scrape + rules config (v9.115)
#
# A ready-to-use Prometheus config: scrape the app's /metrics and load the
# Polaris alerting rules. As shipped it is the observability overlay's
# (polaris_web/docker-compose.observability.yml): Prometheus runs on the stack's
# own network and scrapes the app there, never through the public edge, which
# refuses /metrics to anyone not named in POLARIS_METRICS_ALLOW. A Prometheus
# elsewhere replaces the discovery block with its own targets. `alerting`
# targets the shipped alertmanager.yml (v9.175); the pager URL it notifies is
# operator-supplied (see README.md). Validate with: promtool check config prometheus.yml
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - polaris-alerts.yml
  - polaris-slo.yml            # SLI and error-budget recording rules (v9.241)

# v9.175 (P0.10): the shipped Alertmanager (alertmanager.yml routes to the
# pager receiver). `alertmanager:9093` is the service name on the deployment's
# network; change the host if yours differs.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: polaris
    metrics_path: /metrics
    scheme: http
    # Lab record 017 (gate row OP-15): every app container on the network, found by its compose
    # service name, blue-green colour included. A name that does not resolve (no app-green
    # without the blue-green overlay) yields no target, so it never reads as an app that is down.
    dns_sd_configs:
      - names: ['app', 'app-green']
        type: A
        port: 8000
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  # Lab record 017 (gate row OP-15): the certificate the TLS edge serves, read by the blackbox
  # exporter (blackbox.yml, module edge_tls) from inside the network, under the deployment's own
  # domain. PolarisCertificateExpiring pages on it.
  - job_name: polaris-edge-tls
    metrics_path: /probe
    params:
      module: [edge_tls]
    static_configs:
      - targets: ['https://caddy:8443/api/health/live']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - target_label: __address__
        replacement: blackbox:9115
