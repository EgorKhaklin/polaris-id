# Polaris: Prometheus alerting rules (v9.115)
#
# A real, validated rules file the operator drops into Prometheus
# (rule_files in prometheus.yml), not just a doc snippet. Severity labels map
# to docs/operator/DR.md's SEV ladder; route them to your Alertmanager /
# pager (the alerting backend is operator-provided).
#
# Metric-aggregation note: as of v9.120 the app's /metrics aggregates across all
# gunicorn workers (Prometheus multiprocess mode), so an absolute counter is
# whole-app: which is what makes PolarisDuressEvent's `increase(...)` correct.
# The ratio/quantile alerts (5xx share, latency percentiles) were valid even
# per-worker and remain so. Validate with: promtool check rules polaris-alerts.yml
groups:
  - name: polaris
    rules:
      # SEV-1: the app is unreachable to the scraper (target down) or the
      # process is up but not reporting its info gauge.
      - alert: PolarisAppDown
        expr: up{job="polaris"} == 0
        for: 2m
        labels:
          severity: sev1
        annotations:
          summary: "Polaris target is down (scrape failing for 2m)"
          description: "Prometheus cannot scrape the polaris job; the app is unreachable or crashed."

      - alert: PolarisAppInfoAbsent
        expr: absent(polaris_app_info)
        for: 5m
        labels:
          severity: sev1
        annotations:
          summary: "polaris_app_info absent for 5m"
          description: "The app metadata gauge is missing, the process is not serving /metrics normally."

      # SEV-1: the headline anti-coercion alarm. A duress-code match recorded a
      # silent DuressEvent; a coerced operator needs a human to know NOW. Fires
      # immediately on any new event (no `for`: duress cannot wait out a window).
      # An increase on the multiprocess-aggregated counter (v9.120) is whole-app.
      - alert: PolarisDuressEvent
        expr: increase(polaris_duress_events_total[5m]) > 0
        labels:
          severity: sev1
        annotations:
          summary: "Duress code matched, a coerced verification was recorded"
          description: "polaris_duress_events_total increased: at least one duress-code match in the last 5m. Treat as a person signalling coercion; work the PolarisDuressEvent runbook out-of-band."

      # SEV-1: the two-witness availability alarm (P1.18 item 5). The verify-at-use
      # path runs a single witness for throughput; continuous sampling replays a
      # fraction through the SECOND witness. A disagreement means the fast witness
      # can no longer be trusted to stand in for the two-witness reference, so the
      # throughput soundness argument is broken. Fires immediately on any new event
      # (no `for`: a witness disagreement cannot wait out a window).
      - alert: PolarisWitnessDisagreement
        expr: increase(polaris_verify_witness_disagreements_total[5m]) > 0
        labels:
          severity: sev1
        annotations:
          summary: "Verify-at-use witness disagreement: the single-witness result diverged from the two-witness reference"
          description: "polaris_verify_witness_disagreements_total increased: sampled second-witness re-verification disagreed with the single-witness verify-at-use result. The fast path's soundness rests on the two witnesses agreeing; page and stop trusting single-witness verification until the divergence is explained."

      # SEV-2: sustained 5xx share. A ratio: valid per worker.
      - alert: PolarisHigh5xx
        expr: |
          sum(rate(polaris_requests_total{status=~"5.."}[5m]))
            / sum(rate(polaris_requests_total[5m]))
            > 0.01
        for: 10m
        labels:
          severity: sev2
        annotations:
          summary: "5xx rate > 1% sustained for 10m"
          description: "The server-error share of requests has exceeded 1% for 10 minutes."

      # SEV-2: DB round-trip p99 over 5s (matches DR.md's SEV-2 threshold).
      - alert: PolarisHighDBLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(polaris_db_query_latency_seconds_bucket[5m])) by (le)) > 5
        for: 5m
        labels:
          severity: sev2
        annotations:
          summary: "DB query p99 latency > 5s"
          description: "The /api/health DB round-trip p99 has exceeded 5 seconds, the database is slow or saturated."

      # SEV-3: request latency p99 elevated (degraded, not down).
      - alert: PolarisHighRequestLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(polaris_request_latency_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels:
          severity: sev3
        annotations:
          summary: "Request p99 latency > 2s"
          description: "Per-route request p99 latency has exceeded 2 seconds for 10 minutes."

      # v9.190 (roadmap P1.8): velocity anomaly alerts. An agency doing far
      # more than its own recent baseline is the abuse signal that quotas may
      # not have been set for: the last hour against 4x its trailing 7-day
      # hourly mean (offset one hour so the burst is not in its own baseline),
      # gated by an absolute floor so a young or quiet agency's first few
      # actions never page. Per-agency counters, never per-person.
      - alert: PolarisIssuanceVelocity
        expr: |
          (sum by (agency_id) (increase(polaris_agency_events_total{kind="issue"}[1h])) > 20)
            and
          (sum by (agency_id) (increase(polaris_agency_events_total{kind="issue"}[1h]))
            > 4 * sum by (agency_id) (increase(polaris_agency_events_total{kind="issue"}[7d] offset 1h)) / 168)
        for: 5m
        labels:
          severity: sev2
        annotations:
          summary: "Issuance velocity anomaly for agency {{ $labels.agency_id }}"
          description: "Agency {{ $labels.agency_id }} issued more than 20 tokens in the last hour and more than 4x its trailing 7-day hourly mean; polaris_agency_events_total{kind=\"issue\"} has the count."

      - alert: PolarisRevocationVelocity
        expr: |
          (sum by (agency_id) (increase(polaris_agency_events_total{kind="revoke"}[1h])) > 5)
            and
          (sum by (agency_id) (increase(polaris_agency_events_total{kind="revoke"}[1h]))
            > 4 * sum by (agency_id) (increase(polaris_agency_events_total{kind="revoke"}[7d] offset 1h)) / 168)
        for: 5m
        labels:
          severity: sev2
        annotations:
          summary: "Revocation velocity anomaly for agency {{ $labels.agency_id }}"
          description: "Tokens issued by agency {{ $labels.agency_id }} were revoked more than 5 times in the last hour and more than 4x its trailing 7-day hourly mean; the R11-6 percentage bound may already have engaged."

      - alert: PolarisVerificationVelocity
        expr: |
          (sum by (agency_id) (increase(polaris_agency_events_total{kind="verify"}[1h])) > 200)
            and
          (sum by (agency_id) (increase(polaris_agency_events_total{kind="verify"}[1h]))
            > 4 * sum by (agency_id) (increase(polaris_agency_events_total{kind="verify"}[7d] offset 1h)) / 168)
        for: 5m
        labels:
          severity: sev2
        annotations:
          summary: "Verification velocity anomaly for agency {{ $labels.agency_id }}"
          description: "Agency {{ $labels.agency_id }} recorded more than 200 verifications in the last hour and more than 4x its trailing 7-day hourly mean. Mass verification is the dragnet shape the vocation refuses."

      # SEV-3: an AgencyQuota cap is refusing writes. Either abuse the cap is
      # doing its job against, or a cap set too low for legitimate volume;
      # both need a human to look. No `for`: one refusal is a fact.
      - alert: PolarisQuotaRefusals
        expr: sum by (agency_id, kind) (increase(polaris_quota_refusals_total[15m])) > 0
        labels:
          severity: sev3
        annotations:
          summary: "Agency {{ $labels.agency_id }} is hitting its {{ $labels.kind }} quota"
          description: "polaris_quota_refusals_total increased: {{ $labels.kind }} writes by agency {{ $labels.agency_id }} were refused by an AgencyQuota cap in the last 15 minutes."
