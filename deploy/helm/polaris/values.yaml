# Polaris Helm reference profile (roadmap P1.5). See docs/operator/KUBERNETES.md.

# The four self-built images plus the pinned Redis. Push them to your registry
# and set the repositories; `kind load docker-image` for a local cluster.
images:
  app: polaris-app:prod
  caddy: polaris-caddy:prod
  pgbouncer: polaris-pgbouncer:prod
  postgres: polaris-postgres:prod
  redis: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
  # The database router (v9.244): the same HAProxy as the compose HA profile.
  haproxy: haproxy:3.1-alpine@sha256:475863a372c92c3dab3d59eafbbf8019dceebcd0c456594551b160ecdba4bdb9
  # For the four self-built images. The drill sets Never (nothing pulled).
  pullPolicy: IfNotPresent
  # Redis is a digest-pinned upstream image the nodes pull themselves: `kind
  # load` of a digest-referenced manifest list fails on the platforms it does
  # not have ("content digest not found"), found by the first local drill.
  redisPullPolicy: IfNotPresent
  haproxyPullPolicy: IfNotPresent

# The public hostname Caddy serves. With edge.tls=acme it must resolve to the
# edge Service's external address before the first start.
domain: polaris.example.org

# security.txt's Contact. Empty means security@ the domain above (RFC 2142's mailbox for it);
# the application refuses to start in production with the placeholder.
securityContact: ""

edge:
  # Who may scrape /metrics and /api/metrics. They carry the duress signal
  # and do not authenticate, so the edge answers 404 to anyone else.
  # "private_ranges" is Caddy's own token; narrow it to the Prometheus
  # CIDR in a real deployment, for example "10.20.0.0/16".
  metricsAllow: "private_ranges"
  # acme: Let's Encrypt for `domain` (needs a reachable LoadBalancer on 80/443).
  # internal: Caddy's internal CA (evaluation, kind, private networks).
  tls: internal
  replicas: 1
  service:
    type: ClusterIP        # LoadBalancer on a real cluster
    httpPort: 80
    httpsPort: 443
  # Requests per minute per client IP at the edge (the prod Caddyfile's value).
  rateLimitPerMinute: 200

app:
  replicas: 2
  webConcurrency: 4
  # Real ML-DSA-65 signing needs the signing key in the secret (see secrets).
  realPqc: true
  # Extra environment for the app pods: the v9.189 session and origin knobs
  # (POLARIS_NETWORK_POLICY_<ROLE>, POLARIS_SESSION_MAX_<ROLE>,
  # POLARIS_SESSION_IDLE_MINUTES_<ROLE>, POLARIS_WEBAUTHN_ATTESTATION,
  # POLARIS_WEBAUTHN_USER_VERIFICATION, POLARIS_WEBAUTHN_REQUIRE_ATTESTATION,
  # POLARIS_WEBAUTHN_ALLOWED_AAGUIDS, POLARIS_WEBAUTHN_HARDWARE_ONLY,
  # POLARIS_ATLAS_BASEMAP_STYLE_URL (a self-hosted basemap, v9.237); see
  # docs/operator/HARDENING.md section 13). A bad value refuses the boot.
  extraEnv: []
  #  - {name: POLARIS_NETWORK_POLICY_ADMIN, value: "10.20.0.0/16"}
  #  - {name: POLARIS_WEBAUTHN_USER_VERIFICATION, value: required}

# The cluster's DNS domain, for the fully qualified member names the router
# resolves (HAProxy's resolvers apply no search path).
clusterDomain: cluster.local

pgRouter:
  # HAProxy in front of the Patroni members (v9.244): pgbouncer dials it; it
  # routes 5432 to the member answering /primary and 5433 to a replica, and
  # cuts sessions to a member the moment it is marked down.
  replicas: 1

postgres:
  # Patroni members (v9.244, roadmap P2.13): two is a leader and a streaming
  # replica with automated failover; one is a single Patroni-managed member.
  # The lease store is the Kubernetes API (no etcd); the leader Service's
  # endpoints follow the lease. docs/operator/FAILOVER.md.
  replicas: 2
  patroni:
    # The lease: a leader that cannot renew within ttl seconds demotes itself.
    ttl: 20
    loopWait: 5
    retryTimeout: 5

secrets:
  # An existing Secret holding the files polaris-generate-secrets.sh writes
  # (polaris_secret_key, polaris_db_password, polaris_db_root_password,
  # polaris_replicator_password, polaris_signing_key, postgres_server.crt/.key,
  # pgbouncer_server.crt/.key, pgbackrest_repo_creds.conf, polaris_redis_password,
  # redis_users.acl). Recommended:
  #   kubectl -n polaris create secret generic polaris-secrets --from-file=polaris_web/secrets/
  existingSecret: ""
  # Otherwise the chart creates one: random passwords and self-signed
  # PostgreSQL/pgbouncer certificates, kept stable across upgrades. It cannot
  # mint an ML-DSA-65 signing key, so custody reports degraded until you add
  # polaris_signing_key to the Secret (docs/operator/KEY-CEREMONY.md).
  create: true

persistence:
  storageClass: ""
  postgres: 10Gi
  pgbackrest: 10Gi
  redis: 1Gi

pgbackrest:
  # Continuous WAL archiving to the S3 repo (docs/operator/DR.md); the key pair
  # is pgbackrest_repo_creds.conf in the secret.
  enabled: false
  s3:
    bucket: ""
    endpoint: ""
    region: ""
    path: /polaris

networkPolicy:
  # Default-deny for every pod, then only the edges the topology needs. Needs
  # a CNI that enforces NetworkPolicy (Calico, Cilium, ...); kind's default
  # kindnet does NOT, which is why the drill installs Calico.
  enabled: true
  # The postgres pods reach the API server for the lease. Empty: the chart
  # reads the `kubernetes` Endpoints of the default namespace at install time
  # (the API server's real addresses; NetworkPolicy egress is matched after
  # the Service DNAT). Set them when that lookup is not available (e.g.
  # `helm template`) or the cluster fronts its API differently.
  apiServer:
    cidrs: []          # e.g. ["10.0.0.5/32"]
    port: 6443

# Pod Security: every pod satisfies the `restricted` standard. Label the
# namespace so the API server enforces it:
#   kubectl label ns polaris pod-security.kubernetes.io/enforce=restricted \
#     pod-security.kubernetes.io/warn=restricted pod-security.kubernetes.io/audit=restricted
