apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "polaris.fullname" . }}-app
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicas }}
  # Zero-downtime rollouts: never below the desired count, one new pod at a
  # time, readiness on /api/health/live (the P1.4 blue-green equivalent).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "polaris.selector" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "polaris.selector" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      # No API token: none of these processes talk to the Kubernetes API, and the
      # projected token mount lands under /var/run/secrets, which the app's Secret
      # mount would otherwise make read-only (the mkdir failed at runc).
      automountServiceAccountToken: false
      securityContext:
        {{- include "polaris.podSecurity" (dict "uid" 1000 "gid" 1000) | nindent 8 }}
      # The preStop pause lets the endpoint leave the Service before gunicorn starts draining,
      # then gunicorn's 30 s graceful timeout; 40 s covers both.
      terminationGracePeriodSeconds: 40
      containers:
        - name: app
          image: {{ .Values.images.app }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          securityContext:
            {{- include "polaris.containerSecurity" . | nindent 12 }}
          env:
            - {name: POLARIS_ENV, value: production}
            - {name: POLARIS_PORT, value: "8000"}
            - {name: POLARIS_DB_HOST, value: {{ include "polaris.fullname" . }}-pgbouncer}
            - {name: POLARIS_DB_PORT, value: "6432"}
            - {name: POLARIS_DB_NAME, value: polaris}
            - {name: POLARIS_DB_USER, value: polaris_app}
            - {name: POLARIS_DB_PASSWORD_FILE, value: /run/secrets/polaris_db_password}
            - {name: POLARIS_DB_SSLMODE, value: verify-ca}
            - {name: POLARIS_DB_SSLROOTCERT, value: /etc/polaris-pgb-certs/pgbouncer.crt}
            - {name: POLARIS_SECRET_KEY_FILE, value: /run/secrets/polaris_secret_key}
            - {name: POLARIS_REDIS_HOST, value: {{ include "polaris.fullname" . }}-redis}
            - {name: POLARIS_REDIS_PORT, value: "6379"}
            - {name: POLARIS_REDIS_URL, value: redis://{{ include "polaris.fullname" . }}-redis:6379/0}
            - {name: POLARIS_STATE_DIR, value: /var/lib/polaris/state}
            - {name: PROMETHEUS_MULTIPROC_DIR, value: /tmp/prometheus-multiproc}
            - {name: POLARIS_ZK_BINARY, value: /opt/polaris/zk}
            - {name: POLARIS_SECURITY_CONTACT, value: {{ .Values.securityContact | default (printf "mailto:security@%s" .Values.domain) | quote }}}
            - {name: WEB_CONCURRENCY, value: {{ .Values.app.webConcurrency | quote }}}
            - {name: POLARIS_USE_REAL_PQC, value: {{ ternary "1" "0" .Values.app.realPqc | quote }}}
            - {name: POLARIS_PQC_SIGNING_KEY_FILE, value: /run/secrets/polaris_signing_key}
            - {name: POLARIS_TRUST_PROXY, value: "1"}
            {{- range .Values.app.extraEnv }}
            - {name: {{ .name | quote }}, value: {{ .value | quote }}}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: secrets
              mountPath: /etc/polaris-pgb-certs/pgbouncer.crt
              subPath: pgbouncer_server.crt
              readOnly: true
            - name: state
              mountPath: /var/lib/polaris/state
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/polaris
          startupProbe:
            httpGet: {path: /api/health/live, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /api/health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health/live, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 768Mi}
      volumes:
        - name: secrets
          secret:
            secretName: {{ include "polaris.secretName" . }}
            defaultMode: 0444
            optional: false
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "polaris.fullname" . }}-app
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  selector:
    {{- include "polaris.selector" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "polaris.fullname" . }}-app
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "polaris.selector" . | nindent 6 }}
      app.kubernetes.io/component: app
