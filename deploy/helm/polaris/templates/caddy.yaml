{{- /* G5: where the edge's certificate comes from (values.yaml, edge.tls). */}}
{{- if not (has .Values.edge.tls (list "secret" "acme" "internal")) }}
{{- fail (printf "edge.tls must be secret, acme or internal (got %q)" .Values.edge.tls) }}
{{- end }}
{{- if and (eq .Values.edge.tls "secret") (not .Values.edge.tlsSecret) }}
{{- fail "edge.tls=secret needs edge.tlsSecret: the kubernetes.io/tls Secret that holds the edge's certificate" }}
{{- end }}
{{- if and (eq .Values.edge.tls "acme") (gt (int .Values.edge.replicas) 1) }}
{{- fail "edge.tls=acme serves one replica: replicas that do not share the ACME state each order a certificate and answer only their own challenges. Set edge.replicas=1, or use edge.tls=secret with a certificate cert-manager keeps" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "polaris.fullname" . }}-caddy
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
spec:
  replicas: {{ .Values.edge.replicas }}
  {{- if eq .Values.edge.tls "acme" }}
  # One replica on a ReadWriteOnce volume: a rolling update would start the new pod before the
  # old one lets go of the volume.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "polaris.selector" . | nindent 6 }}
      app.kubernetes.io/component: caddy
  template:
    metadata:
      labels:
        {{- include "polaris.selector" . | nindent 8 }}
        app.kubernetes.io/component: caddy
      annotations:
        checksum/caddyfile: {{ include (print $.Template.BasePath "/configmap-caddy.yaml") . | sha256sum }}
    spec:
      # No API token: none of these processes talk to the Kubernetes API, and the
      # projected token mount lands under /var/run/secrets, which the app's Secret
      # mount would otherwise make read-only (the mkdir failed at runc).
      automountServiceAccountToken: false
      {{- include "polaris.spread" (list "caddy" .) | nindent 6 }}
      {{- include "polaris.fastEviction" . | nindent 6 }}
      securityContext:
        {{- include "polaris.podSecurity" (dict "uid" 1000 "gid" 1000) | nindent 8 }}
      containers:
        - name: caddy
          image: {{ .Values.images.caddy }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "polaris.containerSecurityReadOnly" . | nindent 12 }}
          env:
            - name: POLARIS_DOMAIN
              value: {{ .Values.domain | quote }}
            # The edge holds each request body (up to 1 MiB) until it is complete; the Go
            # runtime collects harder as it nears this, below the 256Mi limit.
            - name: GOMEMLIMIT
              value: 200MiB
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.edge.tls "internal" }}
            - name: edge-ca
              mountPath: /etc/caddy/ca
              readOnly: true
            {{- else if eq .Values.edge.tls "secret" }}
            - name: edge-tls
              mountPath: /etc/caddy/tls
              readOnly: true
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
        {{- if eq .Values.edge.tls "secret" }}
        # G5: Caddy reads a certificate file when it loads its config, so a renewed Secret was not
        # served until the pod restarted. The kubelet updates a Secret volume (no subPath) in
        # place; this reloads Caddy through its admin socket when the files change. It starts
        # with nothing recorded, so its first pass reloads too (retrying until Caddy answers):
        # restarted after a change, it would otherwise take the new files for the served ones.
        - name: tls-reload
          image: {{ .Values.images.caddy }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "polaris.containerSecurityReadOnly" . | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              seen=""
              while :; do
                now=$(cat /etc/caddy/tls/tls.crt /etc/caddy/tls/tls.key | sha256sum)
                if [ "$now" != "$seen" ] && caddy reload --force --config /etc/caddy/Caddyfile \
                     --adapter caddyfile --address unix//config/admin.sock; then
                  seen=$now
                  echo "the edge serves the certificate in edge.tlsSecret: reloaded"
                fi
                sleep 20
              done
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: edge-tls
              mountPath: /etc/caddy/tls
              readOnly: true
            - name: config
              mountPath: /config
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
        {{- end }}
      volumes:
        - name: caddyfile
          configMap:
            name: {{ include "polaris.fullname" . }}-caddy
        - name: data
          {{- if eq .Values.edge.tls "acme" }}
          persistentVolumeClaim:
            claimName: {{ include "polaris.fullname" . }}-caddy-acme
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {medium: Memory}
        {{- if eq .Values.edge.tls "internal" }}
        - name: edge-ca
          secret:
            secretName: {{ include "polaris.fullname" . }}-edge-ca
            defaultMode: 0440
        {{- else if eq .Values.edge.tls "secret" }}
        - name: edge-tls
          secret:
            secretName: {{ .Values.edge.tlsSecret }}
            defaultMode: 0440
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
        {{- end }}
{{- if eq .Values.edge.tls "acme" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "polaris.fullname" . }}-caddy-acme
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
  annotations:
    # G5: the ACME account and certificates outlive an uninstall, so a reinstall does not order
    # them again (Let's Encrypt allows five duplicate certificates a week).
    "helm.sh/resource-policy": keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.edge.acmeVolume.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.edge.acmeVolume.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "polaris.fullname" . }}-caddy
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
spec:
  type: {{ .Values.edge.service.type }}
  {{- if has .Values.edge.service.type (list "LoadBalancer" "NodePort") }}
  externalTrafficPolicy: {{ .Values.edge.service.externalTrafficPolicy | default "Local" }}
  {{- end }}
  selector:
    {{- include "polaris.selector" . | nindent 4 }}
    app.kubernetes.io/component: caddy
  ports:
    - name: http
      port: {{ .Values.edge.service.httpPort }}
      targetPort: http
    - name: https
      port: {{ .Values.edge.service.httpsPort }}
      targetPort: https
---
{{ include "polaris.pdb" (list "caddy" .) }}
