apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "polaris.fullname" . }}-caddy
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
data:
  # The k8s edge config: the same proxy, headers, rate limit and liveness-based
  # upstream retry as polaris_web/Caddyfile, with Caddy running as a non-root
  # user on 8080/8443 (the Service maps 80/443) and logging to stdout.
  Caddyfile: |
    {
        admin unix//config/admin.sock         # live reloads through kubectl exec (v9.240)
        http_port 8080
        https_port 8443
        # v9.239 — Caddy's automatic HTTP-to-HTTPS redirect names :8443 when
        # https_port is not 443; the explicit http:// site below redirects to
        # the domain on the port the client used.
        auto_https disable_redirects
        {{- if eq .Values.edge.tls "acme" }}
        email admin@{{ .Values.domain }}
        {{- end }}
        {{- if eq .Values.edge.tls "internal" }}
        # G5: the internal CA's root is the chart's (Secret <release>-edge-ca), not one each
        # replica mints into its own emptyDir: every replica and every restart chains to the
        # root a client was given. Each replica still makes its own intermediate under it.
        pki {
            ca local {
                root {
                    format pem_file
                    cert /etc/caddy/ca/ca.crt
                    key /etc/caddy/ca/ca.key
                }
            }
        }
        skip_install_trust
        {{- end }}
        log {
            output stdout
            format json
            level INFO
        }
        servers {
            protocols h1 h2 h3
            metrics
            # Lab record 017 (OP-26): the load balancer in front of the edge, if any, by
            # address range (edge.trustedProxies); behind it the client address is read from
            # X-Forwarded-For right to left, past those hops only. Empty: none is trusted.
            trusted_proxies static {{ .Values.edge.trustedProxies | default "0.0.0.0/32" }}
            trusted_proxies_strict
            # Lab record 017 (OP-26): an L4 balancer that rewrites source addresses (a cloud network
            # load balancer with PROXY protocol v2 turned on) can pass the client's own in a PROXY
            # header. Only the sources edge.proxyProtocolFrom names are read; from any other the
            # header is not parsed (skip), so a client sending one fails its TLS handshake. Empty, it
            # names an address no connection comes from.
            listener_wrappers {
                proxy_protocol {
                    timeout 5s
                    allow {{ .Values.edge.proxyProtocolFrom | default "255.255.255.255/32" }}
                    fallback_policy skip
                }
                tls
            }
            # Lab record 017, phase 5: a client that sends its request slowly is cut off here, not
            # left holding a connection (scripts/polaris-edge-limits-drill.sh).
            timeouts {
                read_header 10s
                read_body 30s
                idle 2m
            }
        }
    }

    {{ .Values.domain }} {
        {{- if eq .Values.edge.tls "internal" }}
        tls internal
        {{- else if eq .Values.edge.tls "secret" }}
        # G5: the certificate edge.tlsSecret holds; the tls-reload container reloads Caddy when
        # the Secret changes (Caddy reads a certificate file only when it loads its config).
        tls /etc/caddy/tls/tls.crt /etc/caddy/tls/tls.key
        {{- end }}

        # The metrics surfaces carry the duress signal and do not
        # authenticate: restrict them to the monitoring network at the edge,
        # which edge.metricsAllow names. Unset, no client is allowed
        # (0.0.0.0/32): behind a LoadBalancer Service with the default
        # externalTrafficPolicy every client arrives from a node's private
        # address. An in-cluster Prometheus scrapes the app Service directly.
        @metrics_from_outside {
            path /metrics /api/metrics
            not remote_ip {{ .Values.edge.metricsAllow | default "0.0.0.0/32" }}
        }
        respond @metrics_from_outside 404

        # Lab record 017, phase 5: the app's own body limit (1 MiB), refused here, before the app.
        request_body {
            max_size 1MiB
        }

        reverse_proxy {{ include "polaris.fullname" . }}-app:8000 {
            header_up X-Real-IP {client_ip}
            header_up X-Forwarded-For {client_ip}
            header_up X-Forwarded-Proto {scheme}
            header_up X-Forwarded-Host {host}
            # Lab record 017, phase 5: the edge reads the whole body before the app sees the request.
            # The app's workers are synchronous, four to an instance: a body passed through as it
            # arrives held one for as long as its client took to send it.
            request_buffers 1MiB
            lb_policy round_robin
            lb_try_duration 15s
            lb_try_interval 250ms
            fail_duration 10s
            health_uri /api/health/live
            health_interval 2s
            health_timeout 2s
            transport http {
                dial_timeout 5s
                response_header_timeout 30s
                read_timeout 60s
                write_timeout 60s
            }
        }

        encode gzip zstd

        header {
            {{- if eq .Values.edge.tls "acme" }}
            Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
            {{- end }}
            X-Frame-Options "DENY"
            X-Content-Type-Options "nosniff"
            Referrer-Policy "strict-origin-when-cross-origin"
            Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
            Cross-Origin-Opener-Policy "same-origin"
            Cross-Origin-Resource-Policy "same-origin"
            -Server
            -X-Powered-By
        }

        rate_limit {
            zone polaris_global {
                key {client_ip}
                events {{ .Values.edge.rateLimitPerMinute }}
                window 1m
            }
        }
    }

    http://{{ .Values.domain }} {
        redir https://{{ .Values.domain }}{uri} permanent
    }
