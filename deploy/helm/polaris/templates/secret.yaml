{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $name := printf "%s-secrets" (include "polaris.fullname" .) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $pgCert := genSelfSignedCert (printf "%s-postgres" (include "polaris.fullname" .)) nil (list (printf "%s-postgres" (include "polaris.fullname" .)) "postgres") 825 }}
{{- $pgbCert := genSelfSignedCert (printf "%s-pgbouncer" (include "polaris.fullname" .)) nil (list (printf "%s-pgbouncer" (include "polaris.fullname" .)) "pgbouncer") 825 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
  annotations:
    # Values are generated once and kept across upgrades (lookup), like
    # polaris-generate-secrets.sh's if-missing behaviour.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if $existing }}
  {{- range $k, $v := $existing.data }}
  {{ $k }}: {{ $v }}
  {{- end }}
  {{- if not (hasKey $existing.data "polaris_secret_key_fallbacks") }}
  {{- /* Lab record 017, phase 4b: a Secret that predates the fallbacks gains them on upgrade. */}}
  polaris_secret_key_fallbacks: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
  {{- else }}
  polaris_secret_key: {{ randAlphaNum 64 | b64enc }}
  polaris_secret_key_fallbacks: {{ randAlphaNum 64 | b64enc }}
  polaris_db_password: {{ randAlphaNum 48 | b64enc }}
  polaris_db_root_password: {{ randAlphaNum 48 | b64enc }}
  polaris_replicator_password: {{ randAlphaNum 48 | b64enc }}
  postgres_server.crt: {{ $pgCert.Cert | b64enc }}
  postgres_server.key: {{ $pgCert.Key | b64enc }}
  pgbouncer_server.crt: {{ $pgbCert.Cert | b64enc }}
  pgbouncer_server.key: {{ $pgbCert.Key | b64enc }}
  pgbackrest_repo_creds.conf: {{ "# S3 key pair for the offsite repo (docs/operator/DR.md)\n# [global]\n# repo1-s3-key=\n# repo1-s3-key-secret=\n" | b64enc }}
  {{- end }}
{{- end }}
