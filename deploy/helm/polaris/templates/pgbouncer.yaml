apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "polaris.fullname" . }}-pgbouncer
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  replicas: {{ .Values.pgbouncer.replicas }}
  selector:
    matchLabels:
      {{- include "polaris.selector" . | nindent 6 }}
      app.kubernetes.io/component: pgbouncer
  template:
    metadata:
      labels:
        {{- include "polaris.selector" . | nindent 8 }}
        app.kubernetes.io/component: pgbouncer
    spec:
      # No API token: none of these processes talk to the Kubernetes API, and the
      # projected token mount lands under /var/run/secrets, which the app's Secret
      # mount would otherwise make read-only (the mkdir failed at runc).
      automountServiceAccountToken: false
      {{- include "polaris.spread" (list "pgbouncer" .) | nindent 6 }}
      {{- include "polaris.fastEviction" . | nindent 6 }}
      securityContext:
        {{- include "polaris.podSecurity" (dict "uid" 1000 "gid" 1000) | nindent 8 }}
      containers:
        - name: pgbouncer
          image: {{ .Values.images.pgbouncer }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "polaris.containerSecurityReadOnly" . | nindent 12 }}
          env:
            - {name: POLARIS_DB_HOST, value: {{ include "polaris.fullname" . }}-pg-router}
            - {name: POLARIS_DB_PORT, value: "5432"}
            - {name: POLARIS_DB_NAME, value: polaris}
            - {name: POLARIS_DB_USER, value: polaris_app}
            - {name: POLARIS_DB_PASSWORD_FILE, value: /run/secrets/polaris_db_password}
            - {name: PGBOUNCER_LISTEN_PORT, value: "6432"}
            - {name: PGBOUNCER_POOL_MODE, value: session}   # transaction mode leaks the operator scope
            - {name: PGBOUNCER_DEFAULT_POOL_SIZE, value: "20"}
            - {name: PGBOUNCER_MIN_POOL_SIZE, value: "5"}
            - {name: PGBOUNCER_RESERVE_POOL_SIZE, value: "5"}
            - {name: PGBOUNCER_MAX_CLIENT_CONN, value: "500"}
            - {name: PGBOUNCER_MAX_DB_CONNECTIONS, value: "50"}
            # v9.242: retry a failed backend connect after 1 s (PgBouncer defaults to 15 s;
            # a half-second database crash measured as a 16.2 s outage on that default).
            - {name: PGBOUNCER_SERVER_LOGIN_RETRY, value: "1"}
            - {name: PGBOUNCER_DNS_NXDOMAIN_TTL, value: "1"}
            - {name: PGBOUNCER_SERVER_CONNECT_TIMEOUT, value: "3"}
            - {name: PGBOUNCER_TCP_USER_TIMEOUT, value: "5000"}
            - {name: PGBOUNCER_QUERY_TIMEOUT, value: "15"}
            - {name: PGBOUNCER_SERVER_TLS_SSLMODE, value: verify-ca}
            - {name: PGBOUNCER_SERVER_TLS_CA_FILE, value: /etc/polaris-pg-certs/postgres.crt}
            - {name: PGBOUNCER_CLIENT_TLS_SSLMODE, value: require}
            - {name: PGBOUNCER_CLIENT_TLS_CERT_FILE, value: /etc/polaris-pgb-certs/pgbouncer.crt}
            - {name: PGBOUNCER_CLIENT_TLS_KEY_FILE, value: /etc/polaris-pgb-certs/pgbouncer.key}
          ports:
            - name: pgbouncer
              containerPort: 6432
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets/polaris_db_password, subPath: polaris_db_password, readOnly: true}
            - {name: secrets, mountPath: /etc/polaris-pg-certs/postgres.crt, subPath: postgres_server.crt, readOnly: true}
            - {name: secrets, mountPath: /etc/polaris-pgb-certs/pgbouncer.crt, subPath: pgbouncer_server.crt, readOnly: true}
            - {name: secrets, mountPath: /etc/polaris-pgb-certs/pgbouncer.key, subPath: pgbouncer_server.key, readOnly: true}
            # The entrypoint writes pgbouncer.ini and userlist.txt (the database password) here.
            - {name: conf, mountPath: /etc/pgbouncer}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        # Only the keys the pooler reads, 0440 under the pod's group.
        - name: secrets
          secret:
            secretName: {{ include "polaris.secretName" . }}
            defaultMode: 0440
            items:
              - {key: polaris_db_password, path: polaris_db_password}
              - {key: postgres_server.crt, path: postgres_server.crt}
              - {key: pgbouncer_server.crt, path: pgbouncer_server.crt}
              - {key: pgbouncer_server.key, path: pgbouncer_server.key}
        - name: conf
          emptyDir: {medium: Memory}
        - name: tmp
          emptyDir: {medium: Memory}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "polaris.fullname" . }}-pgbouncer
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  selector:
    {{- include "polaris.selector" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: pgbouncer
---
{{ include "polaris.pdb" (list "pgbouncer" .) }}
