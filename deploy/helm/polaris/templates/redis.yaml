apiVersion: v1
kind: Service
metadata:
  name: {{ include "polaris.fullname" . }}-redis
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  selector:
    {{- include "polaris.selector" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Lab record 017 (gate row OP-7): a Deployment on an emptyDir, so a node that stops answering does not
# keep it: a StatefulSet's pod waits for its node forever, and the rate limiter fails closed without
# Redis (writes and logins refused). Its sliding windows are short-lived and the ACL comes from the
# Secret, so nothing is lost but the current windows. Upgrading from a chart with the StatefulSet leaves
# its volume claim (data-<release>-redis-0) to delete.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "polaris.fullname" . }}-redis
  labels:
    {{- include "polaris.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "polaris.selector" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "polaris.selector" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      # No API token (see app.yaml); the projected token mount would collide
      # with the Secret mounts under /run/secrets.
      automountServiceAccountToken: false
      {{- include "polaris.fastEviction" . | nindent 6 }}
      securityContext:
        {{- include "polaris.podSecurity" (dict "uid" 999 "gid" 1000) | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.images.redis }}
          imagePullPolicy: {{ .Values.images.redisPullPolicy }}
          securityContext:
            {{- include "polaris.containerSecurityReadOnly" . | nindent 12 }}
          # Lab record 017, phase 4a: users come from the Secret's redis_users.acl, which holds
          # only the app password's SHA-256. `default` is off; `health` may only PING.
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--aclfile", "/run/secrets/redis/users.acl"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
            - name: acl
              mountPath: /run/secrets/redis
              readOnly: true
          readinessProbe:
            exec:
              command: ["redis-cli", "--no-auth-warning", "--user", "health", "--pass", "health", "ping"]
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 320Mi}
      volumes:
        - name: acl
          secret:
            secretName: {{ include "polaris.secretName" . }}
            defaultMode: 0444
            items:
              - {key: redis_users.acl, path: users.acl}
        - name: data
          emptyDir: {}
