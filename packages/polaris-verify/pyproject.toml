[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-verify"
version = "0.1.0"
description = "Detached verifier for Polaris identity credentials and signed artifacts: offline authenticity, no server, no database."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Egor Khaklin" }]
keywords = ["identity", "credential", "verifier", "ml-dsa", "post-quantum"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

# No runtime dependency is declared on purpose. The verifier needs SOME real ML-DSA
# backend to do real work, and which one is the operator's choice: liboqs is the
# reference implementation but is not pip-installable everywhere, and cryptography>=48
# carries ML-DSA through OpenSSL. Pulling one in silently would make the choice the
# contract says the caller must state. Install an extra instead.
dependencies = []

[project.optional-dependencies]
cryptography = ["cryptography>=48"]
oqs = ["oqs>=0.10"]

[project.scripts]
polaris-verify = "polaris_verify_cli.verifier:main"

[project.urls]
Homepage = "https://github.com/EgorKhaklin/polaris-id"
Conformance = "https://github.com/EgorKhaklin/polaris-id/tree/main/conformance"

[tool.setuptools.packages.find]
where = ["."]
include = ["polaris_verify_cli*"]
