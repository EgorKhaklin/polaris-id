# Polaris pre-commit hooks
#
# A fast pre-push safety net. CI runs the full suite; these hooks catch the
# common regressions before they land.
#
# Install:
#     pip install pre-commit      # in the dev venv
#     pre-commit install          # one-time per clone
#
# Run manually:
#     pre-commit run --all-files
#
# Local hooks (no network); every entry is also runnable by hand from scripts/.
repos:
  - repo: local
    hooks:
      # The flat C1-C10 invariant layer. Exits non-zero on any FAIL.
      - id: polaris-checks
        name: polaris-checks (C1-C10 invariant layer)
        entry: python3 -m polaris_checks.run
        language: system
        pass_filenames: false
        always_run: true

      # ruff (pyflakes F rules, ruff.toml): unused imports, dead locals,
      # undefined names, placeholder-free f-strings. A local hook to keep the
      # config network-free; ruff is installed from requirements-dev.txt.
      - id: ruff
        name: ruff (unused imports + dead code hygiene)
        entry: ruff check
        language: system
        types_or: [python, pyi]

      # A check and its detection test change together. polaris-ship.py's plan already
      # says so ("a check moved: its detection test must still discriminate"), and on
      # 2026-09-18 a commit went out with checks.py edited and this suite red: the
      # invariant layer above was green, because a check passing says nothing about
      # whether it can still FAIL. Scoped to polaris_checks/ so an ordinary commit does
      # not pay the 30 seconds.
      - id: polaris-detection-tests
        name: detection tests (a changed check must still discriminate)
        entry: python3 -m pytest polaris_checks/test_checks.py -q
        language: system
        pass_filenames: false
        files: '^polaris_checks/'

      # Cross-reference integrity: every Markdown link + code path resolves.
      - id: polaris-link-check
        name: polaris-link-check (Markdown + cross-ref resolution)
        entry: bash scripts/polaris-link-check.sh --ci
        language: system
        pass_filenames: false
        always_run: true

      # Production compose must never carry a literal POLARIS_SECRET_KEY.
      - id: no-secret-in-prod-compose
        name: no sensitive env var literals in production compose
        entry: bash -c 'if grep -E "^\s*POLARIS_SECRET_KEY:\s*[\"a-zA-Z]" polaris_web/docker-compose.prod.yml 2>/dev/null; then echo "POLARIS_SECRET_KEY literal in prod compose"; exit 1; fi'
        language: system
        pass_filenames: false
        files: '^polaris_web/docker-compose\.prod\.yml$'

      # Project standard (docs/CONVENTIONS.md section 10): no em-dashes in
      # prose on any human-facing surface. Blocks only NEW em-dashes (via the
      # staged diff). Exempt: CHANGELOG.md and the two verbatim records,
      # DEVNOTES/record.md and docs/operator/DR-DRILLS.md. The design records
      # were exempt while they sat under DEVNOTES/ships/; they are published
      # documentation now, and the exemption went with the directory.
      - id: em-dash-block-new
        name: em-dash block on new lines (docs/CONVENTIONS.md section 10)
        entry: |
          bash -c '
            DIFF=$(git diff --cached --unified=0 -- "*.md" "docs/**" "DEVNOTES/**" "meta/**" "site/**" "deploy/**" "polaris_web/templates/**" NOTICE ":(exclude)CHANGELOG.md" ":(exclude)DEVNOTES/record.md" ":(exclude)docs/operator/DR-DRILLS.md" 2>/dev/null);
            if [ -z "$DIFF" ]; then exit 0; fi;
            VIOL=$(echo "$DIFF" | grep -E "^\+" | grep -v "^\+\+\+" | grep "—" || true);
            if [ -n "$VIOL" ]; then
              echo "Adding an em-dash to a human-facing document (docs/CONVENTIONS.md section 10 forbids):";
              echo "$VIOL" | head -5 | sed "s/^/  /";
              echo "Substitute with a colon, comma, parentheses, or a sentence break.";
              exit 1;
            fi;
          '
        language: system
        pass_filenames: false
        always_run: true
