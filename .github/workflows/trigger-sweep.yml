# ============================================================================
# trigger-sweep.yml - the exhaustive half of the trigger mutation drill.
#
# ci.yml runs the drill in fast mode on every push: each trigger is dropped and
# the two cheap suites must go red. Eleven triggers are caught only by the
# application suite, which takes three and a half minutes per run, so fast mode
# declares those rather than re-checking them.
#
# This workflow re-establishes that declaration from scratch: for every trigger
# the fast suites do not catch, it runs the whole application suite. That is
# hours of work, which is why it is weekly rather than per push. Without it,
# APP_SUITE_COVERS would be a list asserting coverage that nothing re-measures,
# which is the exact failure this drill exists to catch.
# ============================================================================
name: Trigger sweep (exhaustive)

on:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: Every trigger, against every suite
    runs-on: ubuntu-latest
    timeout-minutes: 330
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polaris_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POLARIS_DB_HOST: localhost
      POLARIS_DB_PORT: "5432"
      POLARIS_DB_NAME: polaris_test
      POLARIS_DB_USER: postgres
      PGPASSWORD: postgres
      POLARIS_DB_PASSWORD: postgres
      POLARIS_SECRET_KEY: trigger-sweep-secret
      POLARIS_STATE_DIR: /tmp/polaris-state
      POLARIS_PQC_PROFILE: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app stack
        run: |
          python -m pip install --upgrade pip
          pip install -r polaris_web/requirements.txt

      - name: Install the postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Load the schema and apply the migrations
        run: |
          mkdir -p "$POLARIS_STATE_DIR"
          cd polaris_sql
          psql -h localhost -U postgres -d polaris_test -v ON_ERROR_STOP=1 -f 00_load_all.sql
          for f in $(ls migrations/*.up.sql | sort); do
            psql -h localhost -U postgres -d polaris_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Every trigger, against every suite
        run: python scripts/polaris-trigger-mutation-drill.py --exhaustive
