# ============================================================================
# trigger-sweep.yml - the exhaustive half of the trigger mutation drill.
#
# ci.yml runs the drill in fast mode on every push: each trigger is dropped and
# the two cheap suites must go red. Eleven triggers are caught only by the
# application suite, which takes three and a half minutes per run, so fast mode
# declares those rather than re-checking them.
#
# This workflow re-establishes that declaration from scratch: for every trigger
# the fast suites do not catch, it runs the whole application suite. That is
# hours of work, which is why it is weekly rather than per push. Without it,
# APP_SUITE_COVERS would be a list asserting coverage that nothing re-measures,
# which is the exact failure this drill exists to catch.
# ============================================================================
name: Trigger sweep (exhaustive)

on:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: Every trigger, against every suite
    runs-on: ubuntu-latest
    timeout-minutes: 330
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polaris_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POLARIS_DB_HOST: localhost
      POLARIS_DB_PORT: "5432"
      POLARIS_DB_NAME: polaris_test
      POLARIS_DB_USER: postgres
      PGPASSWORD: postgres
      POLARIS_DB_PASSWORD: postgres
      # The application role's password, as 09_grants.sql creates it. Without it the privilege-
      # boundary tests try the superuser's password, fail to log in, and under CI fail rather than
      # skip: the sweep's baseline was red on 2026-09-26 for exactly that reason.
      POLARIS_APP_TEST_PASSWORD: polaris_dev_password
      POLARIS_SECRET_KEY: trigger-sweep-secret
      POLARIS_STATE_DIR: /tmp/polaris-state
      POLARIS_PQC_PROFILE: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app stack
        run: |
          python -m pip install --upgrade pip
          pip install -r polaris_web/requirements.txt

      - name: Install the postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Load the schema and apply the migrations
        run: |
          mkdir -p "$POLARIS_STATE_DIR"
          cd polaris_sql
          psql -h localhost -U postgres -d polaris_test -v ON_ERROR_STOP=1 -f 00_load_all.sql
          for f in $(ls migrations/*.up.sql | sort); do
            psql -h localhost -U postgres -d polaris_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Every trigger, against every suite
        run: python scripts/polaris-trigger-mutation-drill.py --exhaustive
      # The step above runs the application suite with each trigger dropped in turn, and what
      # it commits meanwhile outlives the mutation (operator accounts created while their
      # recorder was dropped carry no creation event). The next step starts from a clean load.
      - name: Reload the database
        if: always()
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
               -c "DROP DATABASE IF EXISTS polaris_test WITH (FORCE)" -c "CREATE DATABASE polaris_test"
          cd polaris_sql
          psql -h localhost -U postgres -d polaris_test -v ON_ERROR_STOP=1 -f 00_load_all.sql
          for f in $(ls migrations/*.up.sql | sort); do
            psql -h localhost -U postgres -d polaris_test -v ON_ERROR_STOP=1 -f "$f"
          done
      # 2026-09-26: removing a whole trigger is one question; removing ONE refusal inside its
      # function is another. The first measurement found sixteen refusals nothing noticed.
      - name: Every refusal inside every trigger function
        if: always()
        run: python scripts/polaris-trigger-mutation-drill.py --refusals
