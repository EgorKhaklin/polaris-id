# ============================================================================
# mdoc-witness.yml - OID4VCgo, an mdoc verifier written outside this repository, judges every
# mdoc negative vector.
#
# lab/interop/mdoc/witness-oid4vcgo/run.sh builds the witness against the OID4VCgo version its
# go.mod pins and runs it over lab/interop/negative-vectors/mdoc-vectors.json with no network;
# only its first phase, `go mod download`, reaches the Go module proxy. check.py then holds every
# case to the vector's `expected` and every repaired twin to accepted, on the composed path and on
# VerifyResponse, which must have run on every row whose inputs say dc_api.jwt (test_check.py, run
# first, shows check.py failing on each broken case it makes). A bump of the pinned version that changes
# what OID4VCgo asks of its caller, or a vectors change that OID4VCgo reads otherwise, is red on its
# own pull request.
#
# The same run judges lab/interop/mdoc/witness-oid4vcgo/annexc-rows.json, ISO/IEC 18013-7 Annex C
# responses, with OID4VCgo's mdocdcapi.VerifyResponse (annexc/main.go), and agree.py sets each
# verdict beside this repository's at the rows' instant, failing unless both are each row's
# expected one, refused at the stage the row names; each window row is judged again at the run
# date, where both must give the other verdict. agree-gate.sh runs agree.py and passes only on its
# exit 0 with the line AGREEMENT TABLE: PASS and no FAIL line (test_agree.py, run first, shows
# agree.py failing on each broken row set, verdict file and exit status it makes, and the gate on
# each made-up output). A change to the package's verifier that moves an Annex C verdict is red on
# its own pull request too.
# ============================================================================
name: mdoc witness (OID4VCgo judges the mdoc vectors)

on:
  pull_request:
    paths:
      - "lab/interop/mdoc/witness-oid4vcgo/**"
      - "lab/interop/negative-vectors/mdoc-vectors.json"
      - "lab/interop/requirements.txt"
      - "packages/polaris-oid4vp/polaris_oid4vp/**"
      - "packages/polaris-oid4vp/testdata/annex-c/**"
      - ".github/workflows/mdoc-witness.yml"
  push:
    branches: [main]
    paths:
      - "lab/interop/mdoc/witness-oid4vcgo/**"
      - "lab/interop/negative-vectors/mdoc-vectors.json"
      - "lab/interop/requirements.txt"
      - "packages/polaris-oid4vp/polaris_oid4vp/**"
      - "packages/polaris-oid4vp/testdata/annex-c/**"
      - ".github/workflows/mdoc-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witness:
    name: Every mdoc vector judged by OID4VCgo as the vector says
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: The row check fails on each broken case its tests make
        run: python -I lab/interop/mdoc/witness-oid4vcgo/test_check.py

      - name: The agreement check and its gate fail on each broken case their tests make
        run: python -I lab/interop/mdoc/witness-oid4vcgo/test_agree.py

      - name: Build and run the witness (the Go module proxy in phase 1 only)
        env:
          OUT: ${{ runner.temp }}/witness
        run: lab/interop/mdoc/witness-oid4vcgo/run.sh

      - name: Every row as its vector says
        run: >-
          python -I lab/interop/mdoc/witness-oid4vcgo/check.py
          "$RUNNER_TEMP/witness/oid4vcgo.jsonl" lab/interop/negative-vectors/mdoc-vectors.json

      - name: This repository's verifier's dependency, hash-pinned
        run: pip install --require-hashes -r lab/interop/requirements.txt

      - name: Every Annex C row judged by both verifiers as the row says
        run: lab/interop/mdoc/witness-oid4vcgo/agree-gate.sh "$RUNNER_TEMP/witness/annexc.jsonl"
