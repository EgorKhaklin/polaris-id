# ============================================================================
# SBOM + provenance per release (roadmap P0.5 / v9.167, P0.6 / v9.168).
#
# For every release, generate an SPDX 2.3 Software Bill of Materials for each
# shipped artifact, produce a signed SLSA build-provenance attestation over
# them, and attach both to the release. A downstream operator can then answer
# "what is in this exact release" from an SBOM AND cryptographically verify
# "this SBOM was built by this repo's release workflow, not forged" with a
# single `gh attestation verify` (see SECURITY.md), offline if they keep the
# attached bundle.
#
# Releases are immutable once published (SECURITY.md, Repository controls):
# GitHub refuses an asset added after publication. So a release is assembled
# as a DRAFT on a tag that already exists, this workflow is dispatched with
# that tag, attaches the SBOMs and the provenance bundle to the draft, and
# publishes it last. The release is born complete and then sealed. Publishing
# any other way still runs the verify job, which fails when the SBOMs are not
# there, so a release without them is loud rather than quiet.
#
# SBOM tooling: Trivy, the SAME version the image-cve-scan job in ci.yml pins.
# One tool for the CVE gate and the SBOM keeps the bill of materials consistent
# with what the scanner saw; check_sbom_trivy_matches_scan fails CI on drift.
#
# Signing (P0.6): actions/attest-build-provenance signs keyless via GitHub's
# OIDC identity through Sigstore (Fulcio cert + Rekor transparency log). No
# long-lived key exists to leak or rotate; the signer identity is the workflow
# itself. Scope note: this attests the RELEASE ARTIFACTS (the SBOMs). The
# container images are signed at their registry digests by release-images.yml
# (lab record 017, phase 3), with provenance and SBOM attestations attached
# there; see docs/operator/VERIFY-RELEASE.md.
#
# Six artifacts: the Python runtime surface (requirements.txt) and the five
# self-built images (app, caddy, pgbouncer, postgres, etcd). Image SBOMs require the
# built image, so this rebuilds them at the release tag; that is release-cadence
# work, not per-push, so the cost is acceptable.
#
# The build is .github/workflows/sbom-build.yml, a read-only job with no OIDC identity; the job
# here that attests and publishes runs no build step and attests only the files the build
# reported, digest for digest. A pull request that changes how the SBOMs are made or what they
# describe runs the build too, and so does a weekly run on main: read-only, attesting nothing.
# ============================================================================

name: SBOM + provenance per release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the DRAFT release to complete and publish"
        required: true
  release:
    types: [published]
  # A change to how the SBOMs are made, or to what they describe, runs the build before a release.
  pull_request:
    paths:
      - ".github/workflows/sbom.yml"
      - ".github/workflows/sbom-build.yml"
      - "scripts/polaris-sbom-enrich.py"
      - ".github/sbom/**"
      - "scripts/polaris-image-build.sh"
      - "polaris_web/Dockerfile*"
      - "polaris_web/requirements*.txt"
  # Weekly on main, read-only: a base image or package that drifts upstream into something the NTIA
  # minimum elements cannot name shows here before the next release needs it.
  schedule:
    - cron: "23 5 * * 1"

# Read-only by default; the job that attaches, attests and publishes asks for its writes itself.
permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the draft release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # a draft release is visible only with write access
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve the draft release
        id: tag
        # The tag reaches the shell as data in the environment, not spliced into the script.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::'$TAG' is not a version tag"; exit 1; }
          # The SBOMs describe the tagged tree, so the tag must exist before the draft is completed.
          git ls-remote --exit-code --tags "https://github.com/$GH_REPO" "refs/tags/$TAG" >/dev/null \
            || { echo "::error::tag $TAG does not exist; push it, then create the draft on it"; exit 1; }
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft) \
            || { echo "::error::no release for $TAG; create it with gh release create $TAG --draft --verify-tag"; exit 1; }
          [ "$draft" = "true" ] \
            || { echo "::error::$TAG is already published, and a published release is immutable: it cannot take the SBOMs"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Generate the SBOMs and hold them to SPDX 2.3 and the NTIA minimum elements
    needs: [resolve]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'schedule' || needs.resolve.result == 'success') }}
    permissions:
      contents: read
    uses: ./.github/workflows/sbom-build.yml  # zizmor: ignore[self-repository] -- a job's ./ reusable workflow is read at the caller's own commit, not from the runner's workspace
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'schedule' && github.sha || needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}

  publish:
    name: Attest the SBOMs the build made, attach them to the draft, then publish it
    needs: [resolve, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach assets to the draft release and publish it
      id-token: write        # OIDC identity for keyless Sigstore signing
      attestations: write    # store the SLSA provenance attestation
    steps:
      - name: Take the SBOMs the build job made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom

      - name: Hold them to the digests the build job reported
        env:
          WANT: ${{ needs.build.outputs.sha256 }}
        run: |
          [ -n "$WANT" ] || { echo "::error::the build job reported no digests"; exit 1; }
          got=$(cd sbom && sha256sum ./*.spdx.json | sort -k2)
          [ "$got" = "$WANT" ] || { echo "::error::the SBOMs are not the ones the build job made"; printf 'built:\n%s\ntaken:\n%s\n' "$WANT" "$got"; exit 1; }

      # P0.6 — SLSA build-provenance over every SBOM, signed keyless through
      # GitHub OIDC + Sigstore (Fulcio cert, Rekor transparency log). Each SBOM
      # gets a provenance attestation binding its sha256 to this repo + this
      # workflow run; a consumer verifies with:
      #   gh attestation verify sbom-python.spdx.json --repo ${{ github.repository }}
      - name: Attest SBOM provenance (SLSA, keyless)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "sbom/*.spdx.json"

      # The same Sigstore bundle, one per line (the form `gh attestation download` writes), so a
      # stranger can verify offline with --bundle. Checked here exactly as they will check it.
      - name: Keep the provenance bundle beside the SBOMs, and verify it offline
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          jq -c . "$BUNDLE" > sbom/sbom-provenance.intoto.jsonl
          for f in sbom/*.spdx.json; do
            gh attestation verify "$f" --repo "$GH_REPO" --bundle sbom/sbom-provenance.intoto.jsonl \
              --signer-workflow "$GH_REPO/.github/workflows/sbom.yml"
          done

      - name: Attach the SBOMs and the bundle to the draft, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release upload "$TAG" sbom/*.spdx.json sbom/sbom-provenance.intoto.jsonl --clobber
          gh release edit "$TAG" --draft=false

  # Runs after the job above, and on its own whenever a release is published some other way:
  # a published release must carry the six SBOMs and a bundle that verifies each of them.
  verify:
    name: The published release carries its SBOMs and their provenance
    needs: [publish]
    if: always() && (github.event_name == 'release' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download the release's SBOMs and bundle, and verify each
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          [ -n "$TAG" ] || TAG="$INPUT_TAG"
          mkdir rel
          gh release download "$TAG" -D rel -p '*.spdx.json' -p 'sbom-provenance.intoto.jsonl' \
            || { echo "::error::$TAG was published without its SBOMs; it is immutable, so the fix is the next release"; exit 1; }
          fail=0
          for name in python image-app image-caddy image-pgbouncer image-postgres image-etcd; do
            f="rel/sbom-${name}.spdx.json"
            [ -s "$f" ] || { echo "::error::$TAG carries no sbom-${name}.spdx.json"; fail=1; continue; }
            gh attestation verify "$f" --repo "$GH_REPO" --bundle rel/sbom-provenance.intoto.jsonl \
              --signer-workflow "$GH_REPO/.github/workflows/sbom.yml" || fail=1
          done
          [ "$fail" = 0 ] || exit 1
