# ============================================================================
# SBOM + provenance per release (roadmap P0.5 / v9.167, P0.6 / v9.168).
#
# On every published release, generate an SPDX 2.3 Software Bill of Materials
# for each shipped artifact, attach them to the release, and produce a signed
# SLSA build-provenance attestation over them. A downstream operator can then
# answer "what is in this exact release" from an SBOM AND cryptographically
# verify "this SBOM was built by this repo's release workflow, not forged"
# with a single `gh attestation verify` (see SECURITY.md).
#
# SBOM tooling: Trivy, the SAME version the image-cve-scan job in ci.yml pins.
# One tool for the CVE gate and the SBOM keeps the bill of materials consistent
# with what the scanner saw; check_sbom_trivy_matches_scan fails CI on drift.
#
# Signing (P0.6): actions/attest-build-provenance signs keyless via GitHub's
# OIDC identity through Sigstore (Fulcio cert + Rekor transparency log). No
# long-lived key exists to leak or rotate; the signer identity is the workflow
# itself. Scope note: this attests the RELEASE ARTIFACTS (the SBOMs). Signing
# the five container images at a registry digest is deferred until the images
# are actually published to a registry, which is a separate decision paired
# with the P1.5 Kubernetes/registry work; there is nothing at a registry ref
# to sign today.
#
# Five artifacts: the Python runtime surface (requirements.txt) and the four
# self-built images (app, caddy, pgbouncer, postgres, etcd). Image SBOMs require the
# built image, so this rebuilds them at the release tag; that is release-cadence
# work, not per-push, so the cost is acceptable.
# ============================================================================

name: SBOM + provenance per release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)generate SBOMs for"
        required: true

permissions:
  contents: write        # upload assets to the release
  id-token: write        # OIDC identity for keyless Sigstore signing
  attestations: write    # store the SLSA provenance attestation

env:
  # The one place the SBOM generator's Trivy version lives in THIS file. It
  # must equal the image-cve-scan pin in ci.yml (checked by polaris_checks).
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  sbom:
    name: Generate + attach SPDX SBOMs
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release tag
        id: tag
        # The tag reaches the shell as data in the environment, not spliced into the script.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          [ -n "$TAG" ] || TAG="$INPUT_TAG"
          [ -n "$TAG" ] || { echo "::error::no release tag resolved"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout at the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ steps.tag.outputs.tag }}

      - name: Python runtime surface SBOM (SPDX)
        run: |
          mkdir -p sbom
          # Mount the source read-only and an output dir read-write; Trivy
          # writes the SPDX doc to the bind-mounted /out path.
          docker run --rm \
            -v "$PWD/polaris_web:/src:ro" \
            -v "$PWD/sbom:/out" \
            "$TRIVY_IMAGE" fs --format spdx-json \
            --output /out/sbom-python.spdx.json /src/requirements.txt
          test -s sbom/sbom-python.spdx.json || { echo "::error::python SBOM empty"; exit 1; }

      - name: Build the five self-built images
        run: |
          bash scripts/polaris-image-build.sh --stack sbom

      - name: Image SBOMs (SPDX)
        run: |
          for name in app caddy pgbouncer postgres etcd; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/sbom:/out" \
              "$TRIVY_IMAGE" image --format spdx-json \
              --output "/out/sbom-image-${name}.spdx.json" "polaris-${name}:sbom"
            test -s "sbom/sbom-image-${name}.spdx.json" \
              || { echo "::error::image SBOM for ${name} empty"; exit 1; }
          done

      - name: Validate every SBOM is SPDX 2.3
        run: |
          fail=0
          for f in sbom/*.spdx.json; do
            ver=$(python3 -c "import json,sys; print(json.load(open('$f')).get('spdxVersion',''))")
            n=$(python3 -c "import json,sys; d=json.load(open('$f')); print(len([p for p in d.get('packages',[]) if p.get('name')]))")
            echo "$f -> $ver, $n packages"
            [ "$ver" = "SPDX-2.3" ] || { echo "::error::$f is not SPDX-2.3"; fail=1; }
            [ "$n" -ge 1 ] || { echo "::error::$f lists no packages"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1

      - name: Attach SBOMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" sbom/*.spdx.json --clobber

      # P0.6 — SLSA build-provenance over every SBOM, signed keyless through
      # GitHub OIDC + Sigstore (Fulcio cert, Rekor transparency log). Each SBOM
      # gets a provenance attestation binding its sha256 to this repo + this
      # workflow run; a consumer verifies with:
      #   gh attestation verify sbom-python.spdx.json --repo ${{ github.repository }}
      - name: Attest SBOM provenance (SLSA, keyless)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "sbom/*.spdx.json"
