# The old project-site address, https://egorkhaklin.github.io/polaris-id/, kept as a redirect.
# Since 2026-09-29 the site is served by Cloudflare from site/ (wrangler.jsonc), at
# https://polaris-id.e-khaklin.workers.dev/, because GitHub Pages cannot send the security
# headers in site/_headers. Links already published (posts, applications, papers) still arrive.
#
# The verify job keeps running on every push to main: the page states counts that live
# elsewhere in the tree (the schema, the check layer, ci.yml), so it recomputes them and checks
# that every link resolves. The same checks gate the merge through the required invariants job.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: The page's numbers and links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Every stated count is recomputed from the tree
        run: python3 -m polaris_checks.run
      - name: Every link and image on the page resolves
        run: bash scripts/polaris-link-check.sh --ci

  deploy:
    name: Redirect the old GitHub Pages address to the project site
    needs: verify
    runs-on: ubuntu-latest
    # Only this job deploys, so only this job can write Pages or mint an OIDC token.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Write the redirect
        env:
          SITE: https://polaris-id.e-khaklin.workers.dev/
        run: |
          mkdir redirect
          for page in index.html 404.html; do
            cat > "redirect/$page" <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <title>Polaris: the project site has moved</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="$SITE">
          <meta http-equiv="refresh" content="0; url=$SITE">
          </head>
          <body>
          <p>The Polaris project site is at <a href="$SITE">$SITE</a>.</p>
          </body>
          </html>
          HTML
          done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: redirect/
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
