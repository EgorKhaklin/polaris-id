name: Publish product artifacts

# MANUAL ONLY. No push, no tag, no release trigger. Publishing to a public registry is
# irreversible in the ways that matter: a name is claimed for good and a version number can
# never be reused, even after a yank. So this runs when a person asks it to and not before,
# and it defaults to a dry run.
#
# The gate is not optional: every job builds the artifact and runs the product boundary
# drill against it first. Something that fails the install test is not published, because
# the failure mode this exists to prevent is a stranger's first `pip install` being broken.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to publish'
        required: true
        default: 'dry-run-everything'
        type: choice
        options:
          - dry-run-everything
          - polaris-verify (PyPI)
          - polaris-sdk-python (PyPI)
          - polaris-oid4vp (PyPI)
          - polaris-sdk-ts (npm)
      confirm:
        description: 'Type PUBLISH to actually publish. Anything else stays a dry run.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-and-gate:
    name: Build every artifact and prove it installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install the TypeScript SDK's pinned dependencies
        run: cd sdk/typescript && npm ci

      # The same drill CI runs on every push. Publishing is exactly when it matters most.
      - name: Product boundary — a stranger installs these and uses them
        run: python scripts/polaris-product-boundary-drill.py

      - name: Build the Python distributions
        run: |
          python -m pip install --quiet build twine
          python -m build --outdir dist/polaris-verify packages/polaris-verify
          python -m build --outdir dist/polaris-sdk-python sdk/python
          python -m build --outdir dist/polaris-oid4vp packages/polaris-oid4vp
      - name: Validate the distribution metadata
        run: python -m twine check dist/*/*
      - name: Pack the npm tarball
        run: cd sdk/typescript && npm pack --pack-destination "$GITHUB_WORKSPACE/dist"

      - name: What would be published
        run: |
          echo "target: ${{ inputs.target }}"
          if [ "${{ inputs.confirm }}" = "PUBLISH" ]; then
            echo "confirm: PUBLISH — a real publish will run"
          else
            echo "confirm: (not PUBLISH) — DRY RUN, nothing leaves this runner"
          fi
          find dist -type f | sort

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          retention-days: 7

  pypi:
    name: Publish to PyPI
    needs: build-and-gate
    if: inputs.confirm == 'PUBLISH' && (inputs.target == 'polaris-verify (PyPI)' || inputs.target == 'polaris-sdk-python (PyPI)' || inputs.target == 'polaris-oid4vp (PyPI)')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so there is no
      # long-lived token in the repository to leak. Configure it once per project at
      # https://pypi.org/manage/account/publishing/ — see docs/RELEASING.md.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Select the one package being published
        run: |
          mkdir -p upload
          case "${{ inputs.target }}" in
            "polaris-verify (PyPI)")     cp dist/polaris-verify/* upload/ ;;
            "polaris-sdk-python (PyPI)") cp dist/polaris-sdk-python/* upload/ ;;
            "polaris-oid4vp (PyPI)")     cp dist/polaris-oid4vp/* upload/ ;;
          esac
          ls -l upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload

  npm:
    name: Publish to npm
    needs: build-and-gate
    if: inputs.confirm == 'PUBLISH' && inputs.target == 'polaris-sdk-ts (npm)'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # npm Trusted Publishing, same shape as PyPI's: the registry verifies this
      # workflow's identity and the package gets a provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # No registry-url here on purpose: setup-node would write an _authToken placeholder
      # into .npmrc, and a token in the config, even a placeholder, is what npm uses instead
      # of the OIDC exchange. Trusted publishing wants no token anywhere. The CLI is upgraded
      # because the exchange needs npm 11.5.1 or later, and the publish runs verbose so that
      # the exchange's answer is in the log if the registry refuses.
      - uses: actions/setup-node@v7
        with:
          # `npm stage publish` needs Node 22.14.0 or later. 24 satisfies it; the assertion
          # below is what actually holds the floor, because a pin can be edited.
          node-version: '24'
      # `npm@latest` is not a version floor, it is a hope. Two things below depend on real
      # floors: the OIDC exchange needs 11.5.1 and `npm stage publish` needs 11.15.0. If the
      # registry ever serves an older `latest`, a silent fall back to a direct publish is
      # exactly the outcome staging exists to prevent, so the job refuses instead.
      - name: npm CLI new enough to stage
        run: |
          npm install -g npm@latest
          NPM_V="$(npm --version)"; NODE_V="$(node --version | tr -d v)"
          echo "npm $NPM_V, node $NODE_V"
          need() {
            [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -1)" = "$2" ] || {
              echo "::error::$3 $1 is older than the required $2"; exit 1; }
          }
          need "$NPM_V" 11.15.0 "npm"
          need "$NODE_V" 22.14.0 "node"
      - run: cd sdk/typescript && npm ci
      # prepack builds dist/, which is what `exports` points at. Publishing without it
      # would ship a package with nothing to import, which is the state this repository
      # was already in once and measured rather than assumed.
      # NO TOKEN. npm trusted publishing, the same shape as the PyPI job above: the
      # registry verifies this workflow's OIDC identity and mints a short-lived
      # credential. 0.1.0 needed a bootstrap token because npm cannot do this for a
      # package's FIRST publish -- the trusted publisher is configured on a package
      # page that does not exist until something has been published (npm/cli#8544).
      # That token covered one publish on 2026-09-15 and was revoked the same hour.
      # No long-lived credential for any of the four packages now exists anywhere.
      # npm refuses to publish a prerelease without an explicit dist-tag, so that `latest`
      # is never moved onto a candidate by accident (1.0.0-rc.1 was refused on 2026-09-16,
      # run 35148098228, nothing uploaded). A prerelease version goes out under `next`:
      # `npm install polaris-sdk-ts` keeps resolving the last full release, and the
      # candidate is `npm install polaris-sdk-ts@next`, the same shape as pip's --pre.
      #
      # STAGED, not direct. `npm stage publish` uploads the tarball and stops: the version
      # is not on the registry and nobody can install it until a maintainer runs
      # `npm stage approve <stage-id>` with a 2FA code, which no workflow can produce. So a
      # workflow that is compromised, or simply run by mistake with confirm=PUBLISH, cannot
      # put code in front of an installer on its own. That is the whole reason to prefer it
      # over `npm publish`, and it is why the trusted publisher on npmjs.com should have
      # "allow npm publish" UNCHECKED: with it checked, the direct path stays open beside
      # this one and the approval is optional rather than required.
      #
      # THE JOB GOING GREEN NO LONGER MEANS PUBLISHED. It means staged. The approval is a
      # separate, human, 2FA step, and docs/RELEASING.md carries it.
      - name: Stage the publish
        run: |
          cd sdk/typescript
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          echo "staging polaris-sdk-ts@$VERSION under dist-tag $TAG"
          npm stage publish --provenance --access public --tag "$TAG" --loglevel verbose
      - name: What is staged, and what has to happen next
        run: |
          cd sdk/typescript
          npm stage list || true
          cat <<'EOF'
          ============================================================
          STAGED, NOT PUBLISHED. Nothing is installable yet.
          A maintainer with 2FA finishes it from their own machine:
              npm stage list polaris-sdk-ts
              npm stage view <stage-id>          # inspect before approving
              npm stage download <stage-id>      # or unpack the tarball first
              npm stage approve <stage-id> --otp <code>
          To abandon it instead:
              npm stage reject <stage-id>
          Then verify from the live registry, per docs/RELEASING.md.
          ============================================================
          EOF
