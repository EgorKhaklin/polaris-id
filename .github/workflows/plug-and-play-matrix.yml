# Plug-and-play across environments.
#
# The external doors a stranger installs (polaris-verify, polaris-oid4vp, the SDKs) are published
# packages. Every other workflow in this repository runs on ubuntu-latest with Python 3.12 and
# Node 24, so "it installs and works" is proven on exactly one environment. A stranger on macOS,
# on Windows, or on a different Python or Node has no evidence until here.
#
# This installs each published package the way a stranger does, from the registry, and exercises
# it across an operating-system x interpreter-version matrix. polaris-verify carries controls: a
# genuine credential must be accepted and a tampered one must be refused, so a verifier that
# accepts everything is caught in every environment rather than in none.
#
# It runs when this file changes (to prove the workflow itself), weekly (registry packages drift
# as new OS images and interpreters ship), and on demand. It installs from the registry, so a run
# measures the PUBLISHED packages, not this checkout; the checkout provides only the committed
# test vectors.

name: Plug-and-play across environments

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - ".github/workflows/plug-and-play-matrix.yml"
      - "site/llms.txt"

permissions:
  contents: read

jobs:
  verify:
    name: polaris-verify (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (only for the committed test vectors)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install polaris-verify from PyPI, the way a stranger does
        run: python -m pip install --pre "polaris-verify[cryptography]"
      - name: A genuine credential is accepted (exit 0)
        shell: bash
        run: polaris-verify --pqc-provider auto --signature-only --pack vectors/ml-dsa-65-valid.json
      - name: A tampered signature is refused (exit 2) -- the control
        shell: bash
        run: |
          set +e
          polaris-verify --pqc-provider auto --signature-only --pack vectors/ml-dsa-65-tampered-signature.json
          rc=$?
          [ "$rc" = "2" ] || { echo "expected exit 2 (tampered refused), got $rc"; exit 1; }
          echo "ok: a tampered signature was refused"
      - name: With a trust anchor, the genuine credential is accepted (exit 0)
        shell: bash
        run: polaris-verify --pqc-provider auto --issuer-anchor vectors/anchors/ml-dsa-65-issuer.json --pack vectors/ml-dsa-65-valid.json
      - name: A credential under an untrusted key is refused against that anchor -- the trust control
        shell: bash
        run: |
          set +e
          polaris-verify --pqc-provider auto --issuer-anchor vectors/anchors/ml-dsa-65-issuer.json --pack vectors/ml-dsa-65-wrong-key.json
          rc=$?
          [ "$rc" != "0" ] || { echo "a credential under an untrusted key was accepted"; exit 1; }
          echo "ok: an untrusted key was refused (exit $rc)"
      # site/llms.txt gives a reading agent one command block and the exit codes to expect. This runs
      # that block as written, from an empty folder, against the published package, and holds every
      # exit code the file states, so the file cannot say more than the package does.
      - name: The agent path in site/llms.txt, run as written (a JSON verdict, exit 0; each tampered vector it names exits 2)
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d) && cd "$work"
          python - "$GITHUB_WORKSPACE/site/llms.txt" <<'EOF'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          section = text.split("## Verify a credential offline", 1)[1].split("\n## ", 1)[0]
          fenced = section.split("```")
          assert len(fenced) == 3, "the section must hold exactly one command block"
          tampered = re.findall(r"`(ml-dsa-65-[a-z-]+\.json)`", fenced[2])
          assert len(tampered) >= 3, "the section must name the tampered vectors: %r" % tampered
          open("agent-path.sh", "w", newline="\n").write(fenced[1].lstrip("\n"))
          open("tampered.txt", "w", newline="\n").write("\n".join(tampered) + "\n")
          EOF
          bash -euo pipefail agent-path.sh > out.txt
          python - <<'EOF'
          import json
          lines = open("out.txt").read().splitlines()
          start = max(i for i, line in enumerate(lines) if line.strip() == "{")
          verdict = json.loads("\n".join(lines[start:]))
          assert verdict["authenticity"] == "genuine" and verdict["issuer_trusted"] is True, verdict
          print("ok: the command block's verdict is genuine and trusted, exit 0")
          EOF
          r=https://raw.githubusercontent.com/EgorKhaklin/polaris-id/main
          while read -r t; do
            curl -fsSLO "$r/vectors/$t"
            set +e
            polaris-verify --pqc-provider auto --issuer-anchor ml-dsa-65-issuer.json --pack "$t" --json > /dev/null
            rc=$?
            set -e
            [ "$rc" = 2 ] || { echo "::error::$t exited $rc; site/llms.txt says 2"; exit 1; }
            echo "ok: $t exited 2"
          done < tampered.txt

  oid4vp:
    name: polaris-oid4vp (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install polaris-oid4vp from PyPI
        run: python -m pip install --pre "polaris-oid4vp[cryptography]"
      - name: It imports, so a wallet-facing verifier can be built on it
        shell: bash
        run: python -c "import polaris_oid4vp; print('polaris_oid4vp', getattr(polaris_oid4vp, '__version__', 'unknown'))"

  sdk-python:
    name: polaris-sdk-python (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (only for the committed test vectors)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install polaris-sdk-python from PyPI
        run: python -m pip install --pre polaris-sdk-python
      # The current candidate, not the 0.1.0 a bare install resolves; and the effect, not the
      # install: a genuine credential is authentic and a tampered one is not.
      - name: A genuine credential is authentic and a tampered one is not
        shell: bash
        run: |
          python - <<'PY'
          import json
          import importlib.metadata as md
          from polaris_verify import verify_authenticity
          version = md.version("polaris-sdk-python")
          ok = verify_authenticity(json.load(open("vectors/ml-dsa-65-valid.json")), None).authentic
          bad = verify_authenticity(json.load(open("vectors/ml-dsa-65-tampered-signature.json")), None).authentic
          print("polaris-sdk-python", version, "genuine:", ok, "tampered:", bad)
          raise SystemExit(0 if (not version.startswith("0.") and ok is True and bad is False) else 1)
          PY

  sdk-ts:
    name: polaris-sdk-ts (${{ matrix.os }}, node${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (only for the committed test vectors)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      # Candidates are published under `next`; a bare install resolves npm's `latest`, 0.1.0,
      # which is what this job used to install and test.
      - name: Install polaris-sdk-ts from npm under its next tag, in a bare consumer project
        shell: bash
        run: |
          mkdir consumer && cd consumer
          npm init -y >/dev/null
          npm install polaris-sdk-ts@next
      - name: A genuine credential is authentic and a tampered one is not
        shell: bash
        run: |
          cp vectors/ml-dsa-65-valid.json vectors/ml-dsa-65-tampered-signature.json consumer/
          cd consumer
          cat > first-run.mjs <<'JS'
          import { readFileSync } from "node:fs";
          import { verifyAuthenticity } from "polaris-sdk-ts";
          const read = (f) => JSON.parse(readFileSync(f, "utf8"));
          const version = read("node_modules/polaris-sdk-ts/package.json").version;
          const ok = (await verifyAuthenticity(read("ml-dsa-65-valid.json"))).authentic;
          const bad = (await verifyAuthenticity(read("ml-dsa-65-tampered-signature.json"))).authentic;
          console.log("polaris-sdk-ts", version, "genuine:", ok, "tampered:", bad);
          if (version.startsWith("0.") || ok !== true || bad !== false) process.exit(1);
          JS
          node first-run.mjs
