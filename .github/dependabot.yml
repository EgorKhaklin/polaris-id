# Dependabot: weekly version-update PRs for the Python, Rust, GitHub Actions
# and Docker surfaces. Security advisories arrive through the repository's
# Dependabot alerts and security updates (repository settings), not this file;
# pip-audit in the cve-scan CI job gates the build on a known CVE regardless.
# Merge policy (stated for readers in SECURITY.md): patch and minor bumps are
# batch-applied to main and validated by one full CI run, after which
# Dependabot closes its PRs; majors of foundation dependencies (PostgreSQL,
# the Python base image, plonky2) are deliberate roadmap work, kept out by the
# ignore blocks below. Removing an ignore block is the decision record for
# taking that major.
version: 2
updates:
  # Python runtime + dev dependencies (both requirements files live here).
  - package-ecosystem: pip
    directory: /polaris_web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    ignore:
      # patroni 4.1.5 declares ydiff!=1.4.0,!=1.4.1,<1.5,>=1.2.0. A ydiff at or
      # above 1.5 cannot be installed beside it and makes the postgres/patroni
      # image unbuildable, which takes every container job in CI down with it.
      # Proposed and applied on 2026-09-16, reverted the same day. Remove this
      # block when patroni's own upper bound moves.
      - dependency-name: "ydiff"
        versions: [">=1.5"]

  # The Rust ZK crate.
  - package-ecosystem: cargo
    directory: /polaris_zk
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "plonky2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "plonky2_field"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: ci

  # Docker base images and the prod compose's digest-pinned images: a PR
  # bumps a pinned digest when the upstream tag moves, so a frozen digest
  # still receives security updates.
  - package-ecosystem: docker
    directory: /polaris_web
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: docker
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
