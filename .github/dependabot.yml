# Dependabot: version-update PRs for the Python, Rust, GitHub Actions and Docker
# surfaces, weekly for the product (Monday) and its tooling (Thursday), monthly
# for the lab. Security advisories arrive through the repository's
# Dependabot alerts and security updates (repository settings), not this file;
# pip-audit in the cve-scan CI job gates the build on a known CVE regardless.
# Merge policy (stated for readers in SECURITY.md): patch and minor bumps are
# batch-applied to main and validated by one full CI run, after which
# Dependabot closes its PRs. Each entry groups them into one PR per run (a
# docker entry groups every refresh: a digest-only bump has no semver type),
# so a merge to main re-runs CI for a few grouped PRs, not one per package;
# majors of foundation dependencies (PostgreSQL,
# the Python base image, plonky2) are deliberate roadmap work, kept out by the
# ignore blocks below. Removing an ignore block is the decision record for
# taking that major.
version: 2
updates:
  # Python runtime + dev dependencies (both requirements files live here).
  - package-ecosystem: pip
    directory: /polaris_web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      # psycopg[binary] X requires psycopg-binary==X exactly, so a PR that bumps
      # one alone cannot be installed: on 2026-09-25 the psycopg 3.3.6 PR left
      # psycopg-binary at 3.3.5 and every container job failed to resolve. One
      # group, one PR, both pins together.
      psycopg:
        patterns:
          - "psycopg"
          - "psycopg-binary"
      pip-polaris_web-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # patroni 4.1.5 declares ydiff!=1.4.0,!=1.4.1,<1.5,>=1.2.0. A ydiff at or
      # above 1.5 cannot be installed beside it and makes the postgres/patroni
      # image unbuildable, which takes every container job in CI down with it.
      # Proposed and applied on 2026-09-16, reverted the same day. Remove this
      # block when patroni's own upper bound moves.
      - dependency-name: "ydiff"
        versions: [">=1.5"]

  # The fuzz job's hash-pinned set (atheris and polaris-oid4vp's one dependency),
  # compiled by pip-compile from requirements.in; Dependabot recompiles the hashes.
  - package-ecosystem: pip
    directory: /packages/polaris-oid4vp/fuzz
    schedule:
      interval: weekly
      day: thursday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      pip-packages-polaris-oid4vp-fuzz-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The check-in example's hash-pinned set (fastapi, uvicorn, segno, cryptography), compiled by
  # pip-compile from requirements.in; monthly, as the lab entries are.
  - package-ecosystem: pip
    directory: /packages/polaris-oid4vp/examples/yivi-checkin
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      pip-packages-polaris-oid4vp-examples-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # What lab/interop/*/run.sh install beside polaris-oid4vp: its one dependency (requirements.txt,
  # Python 3.9) and, for a run that builds it from the tree, the build backend
  # (requirements-build.txt, Python 3.10), hash-pinned by pip-compile; Dependabot recompiles both.
  - package-ecosystem: pip
    directory: /lab/interop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      pip-lab-interop-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # cffi 2.1 and pycparser 3 require Python >= 3.10, and these requirements install with
      # --require-hashes on the system Python 3.9 that the stranger's path promises
      # (docs/STRANGER-PATH.md). Proposed and closed on 2026-10-11 (#353, #354). Remove this
      # block when the stranger's path moves past Python 3.9.
      - dependency-name: "cffi"
        versions: [">=2.1"]
      - dependency-name: "pycparser"
        versions: [">=3"]

  # The dependency-audit tools the CVE-scan job runs (pip-audit, bandit), hash-pinned by
  # pip-compile in .github/ci; Dependabot recompiles the hashes.
  - package-ecosystem: pip
    directory: /.github/ci
    schedule:
      interval: weekly
      day: thursday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      pip-github-ci-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The Rust ZK crate.
  - package-ecosystem: cargo
    directory: /polaris_zk
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "plonky2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "plonky2_field"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-polaris_zk-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: ci
    groups:
      github-actions-root-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The toolchain publish.yml builds the Python distributions with (build, setuptools,
  # twine), hash-pinned by pip-compile in .github/publish; Dependabot recompiles it.
  - package-ecosystem: pip
    directory: /.github/publish
    schedule:
      interval: weekly
      day: thursday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      pip-github-publish-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The SPDX project's NTIA checker sbom.yml judges every release SBOM with, and the license
  # list polaris-sbom-enrich.py reads from it, hash-pinned by pip-compile in .github/sbom.
  - package-ecosystem: pip
    directory: /.github/sbom
    schedule:
      interval: weekly
      day: thursday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      pip-github-sbom-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Docker base images (the FROM lines of every Dockerfile here): a PR bumps a
  # pinned digest when the upstream tag moves, so a frozen digest still receives
  # security updates. This ecosystem reads Dockerfiles only; the compose files'
  # images are the docker-compose entry below.
  - package-ecosystem: docker
    directory: /polaris_web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: docker
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
    groups:
      docker-polaris_web-all:
        patterns:
          - "*"

  # The compose files' third-party images (redis, the observability stack): the
  # docker ecosystem above does not read compose files, so until 2026-10-07 their
  # digests moved only by hand (lab record 017).
  - package-ecosystem: docker-compose
    directory: /polaris_web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: docker
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      docker-compose-polaris_web-all:
        patterns:
          - "*"

  # The lab's demo image (lab/strategy/007).
  - package-ecosystem: docker
    directory: /lab/strategy/007
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: docker
    groups:
      docker-lab-strategy-007-all:
        patterns:
          - "*"

  # The TypeScript SDK (published to npm): its lockfile and, when a release falls
  # outside a declared range, the range.
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      npm-sdk-typescript-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The npm tools the lab and the accessibility drill install from their lockfiles,
  # one grouped PR across the five directories.
  - package-ecosystem: npm
    directories:
      - /scripts/accessibility
      - /lab/interop/cheqd
      - /lab/interop/credo
      - /lab/interop/mdoc/witness-eudi
      - /lab/interop/status-list/owf
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      lab-npm:
        patterns:
          - "*"

  # The interop harnesses' own manifests: Go (the irmago wallet), Gradle (the Kotlin wallets and
  # Axle's harness) and Swift (the EUDI iOS wallet). Each pins the outside implementation it drives;
  # one grouped PR a month per ecosystem, run against the published verifier by the wallet canary's
  # pull_request trigger on lab/interop/**. Dependabot does not rewrite Gradle's dependency
  # verification (axle/harness/gradle/verification-metadata.xml): a PR that bumps that harness
  # needs the metadata regenerated before it can pass.
  - package-ecosystem: gomod
    directories:
      - /lab/interop/irmago/wallet
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      lab-gomod:
        patterns:
          - "*"

  # Dependabot cannot regenerate gradle/verification-metadata.xml, so its lab-gradle pull requests
  # fail dependency verification in every harness, and the OSV gate would scan stale pins. They are
  # never merged directly: a maintainer batch takes their versions, regenerates each directory's
  # metadata with `--write-verification-metadata sha256` in the pinned Gradle container, then runs
  # the OSV gate (scripts/polaris-osv-gradle.sh). #357 (2026-10-11) was closed this way.
  - package-ecosystem: gradle
    directories:
      - /lab/interop/axle/harness
      - /lab/interop/eudi-issuer/wallet
      - /lab/interop/eudi-kt/wallet
      - /lab/interop/mdoc/wallet
      - /lab/interop/multipaz/wallet
      - /lab/interop/vck/wallet
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      lab-gradle:
        patterns:
          - "*"

  - package-ecosystem: swift
    directories:
      - /lab/interop/eudi-ios/wallet
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      lab-swift:
        patterns:
          - "*"
    ignore:
      # Pinned to what the EUDI iOS wallet kit 0.54.5 pins (the scoreboard's iOS row). Remove
      # this block when the kit moves.
      - dependency-name: "github.com/eu-digital-identity-wallet/eudi-lib-sdjwt-swift"

  # The published Python packages declare open ranges, so only a release outside a
  # range (polaris-id-cli's psycopg2-binary <3.0, for one) is proposed.
  - package-ecosystem: pip
    directories:
      - /packages/polaris-verify
      - /packages/polaris-oid4vp
      - /sdk/python
      - /polaris_cli
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      pip-published-packages-minor-patch:
        update-types:
          - "minor"
          - "patch"
