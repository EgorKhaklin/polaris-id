#
# The routes of the issuer's own docker-compose/haproxy/haproxy.conf (v0.11.1): Keycloak under
# /idp, the issuer under /pid-issuer, and the well-known rewrites, TLS with upstream's localhost
# certificate. Its status-list route is replaced by the test wallet provider's status list, a file
# run.sh signs, which Keycloak and the issuer fetch at http://haproxy/wallet-provider/status-list.
global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    default_backend no-match

frontend all
    bind 0.0.0.0:80
    bind 0.0.0.0:443 ssl crt /etc/ssl/certs/localhost.tls.pem
    use_backend keycloak-backend if { path_beg /idp }
    use_backend keycloak-backend if { path_beg /.well-known/oauth-authorization-server/idp/realms/pid-issuer-realm }
    use_backend keycloak-backend if { path_beg /.well-known/openid-configuration/idp/realms/pid-issuer-realm }
    use_backend pid-issuer-backend if { path_beg /.well-known/openid-credential-issuer/pid-issuer }
    use_backend pid-issuer-backend if { path_beg /.well-known/oauth-protected-resource/pid-issuer }
    use_backend pid-issuer-backend if { path_beg /.well-known/jwt-vc-issuer/pid-issuer }
    use_backend pid-issuer-backend if { path_beg /pid-issuer }
    use_backend wallet-provider-status-list if { path /wallet-provider/status-list }

backend keycloak-backend
    option forwarded proto host by by_port for
    http-request set-path /idp/realms/pid-issuer-realm/.well-known/oauth-authorization-server if { path_beg /.well-known/oauth-authorization-server/idp/realms/pid-issuer-realm }
    http-request set-path /idp/realms/pid-issuer-realm/.well-known/openid-configuration if { path_beg /.well-known/openid-configuration/idp/realms/pid-issuer-realm }
    server keycloak keycloak:8080

backend pid-issuer-backend
    option forwarded proto host by by_port for
    http-request set-path /pid-issuer/.well-known/openid-credential-issuer if { path_beg /.well-known/openid-credential-issuer/pid-issuer }
    http-request set-path /pid-issuer/.well-known/oauth-protected-resource if { path_beg /.well-known/oauth-protected-resource/pid-issuer }
    http-request set-path /pid-issuer/.well-known/jwt-vc-issuer if { path_beg /.well-known/jwt-vc-issuer/pid-issuer }
    server pid-issuer pid-issuer:8080

backend wallet-provider-status-list
    http-request return status 200 content-type application/statuslist+jwt file /usr/local/etc/haproxy/status-list.jwt

backend no-match
    http-request deny deny_status 404
