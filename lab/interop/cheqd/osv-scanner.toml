# OSV-Scanner exceptions for this walk's npm lockfile. OpenSSF Scorecard's Vulnerabilities check
# runs OSV-Scanner over every lockfile in the repository and reads this file beside it. The walk is
# lab code that drives Credo against a local cheqd network; it is not a Polaris product.

[[IgnoredVulns]]
id = "GHSA-848j-6mx2-7j84"
reason = "elliptic 6.6.1 (every release is affected; none is fixed) arrives only as @credo-ts/cheqd 0.7.2 -> @cheqd/sdk-esm 5.5.1 -> secp256k1 5.0.2, which loads elliptic only when its native binding does not load (it ships prebuilt ones for darwin-arm64, linux-x64 and win32-x64), and the only secp256k1 function @cheqd/sdk-esm calls is publicKeyConvert, inside getCosmosAccount, which no code in this walk calls; it signs nothing. The ledger transactions are signed by @cosmjs/crypto 0.36 on @noble/curves, and the DID payloads, status lists and credentials by Credo's KMS on node:crypto (2026-10-04)."

[[IgnoredVulns]]
id = "GHSA-f9j6-8p6x-r9j6"
reason = "@sd-jwt/decode 0.7.2 and 0.9.2 (no release is fixed; 0.19.0 is the newest) arrives only as @credo-ts/core 0.7.3 -> @animo-id/pex 6.1.1 -> @sd-jwt/decode 0.7.2 (also through @sd-jwt/present 0.7.2) and @credo-ts/core 0.7.3 -> @sphereon/ssi-types 0.33.0 -> @sd-jwt/decode 0.9.2. @credo-ts/core imports @animo-id/pex, and through it ssi-types, only in its DIF Presentation Exchange module, and this walk never enters it: Credo issues and holds here and never verifies a presentation, and its OID4VP holder takes that module only for a request with a presentation_definition, while polaris-oid4vp asks with DCQL. Credo's own SD-JWT signing and verifying (SdJwtVcService, which this walk calls to sign and verify the dc+sd-jwt) runs on @sd-jwt/sd-jwt-vc 0.21.1 over @sd-jwt/core 0.21.1, past the fixed 0.20.0. Polaris's verifier decodes each disclosure as strict UTF-8 and refuses one whose digest the issuer-signed payload does not commit to (packages/polaris-oid4vp/polaris_oid4vp/sdjwt.py, refusal code disclosure; packages/polaris-oid4vp/test_sdjwt.py test_an_uncommitted_disclosure_is_still_refused and test_a_disclosure_that_is_not_utf8_is_refused) (2026-11-04)."
