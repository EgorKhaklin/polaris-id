id = "GHSA-f9j6-8p6x-r9j6"
reason = "@sd-jwt/decode 0.7.2 and 0.9.2 (no release is fixed; 0.19.0 is the newest) arrives only as @credo-ts/core 0.7.4 -> @animo-id/pex 6.1.1 -> @sd-jwt/decode 0.7.2 (also through @sd-jwt/present 0.7.2) and @credo-ts/core 0.7.4 -> @sphereon/ssi-types 0.33.0 -> @sd-jwt/decode 0.9.2. @credo-ts/core imports @animo-id/pex, and through it ssi-types, only in its DIF Presentation Exchange module, and these walks never enter it: Credo is the holder here and never verifies a presentation, and its OID4VP holder takes that module only for a request with a presentation_definition, while polaris-oid4vp asks with DCQL. Credo's own SD-JWT signing and verifying (SdJwtVcService) runs on @sd-jwt/sd-jwt-vc 0.21.1 over @sd-jwt/core 0.21.1, past the fixed 0.20.0, and in these walks Credo is the holder whose presentations polaris-oid4vp judges. Polaris's verifier decodes each disclosure as strict UTF-8 and refuses one whose digest the issuer-signed payload does not commit to (packages/polaris-oid4vp/polaris_oid4vp/sdjwt.py, refusal code disclosure; packages/polaris-oid4vp/test_sdjwt.py test_an_uncommitted_disclosure_is_still_refused and test_a_disclosure_that_is_not_utf8_is_refused) (2026-11-12)."
